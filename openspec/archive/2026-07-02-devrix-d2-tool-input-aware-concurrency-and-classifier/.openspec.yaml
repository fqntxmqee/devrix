v0_backlog:
  symptom:
    - "review d2 领域 kernel 目录下代码": 50 read_file 串行, wall time 长
    - "ConcurrencySafe bool 是 per-tool 静态标签, 不知道具体 input": bash ls vs bash rm 一视同仁
    - "LLM auto-mode 误判": 缺 per-input 投影 → classifier 输入包含无关上下文
    - "GrowthBook flag 全删": bash 30K→50K 是真实 ops 调优, 删了反弹
    - "Bash 并发失败时其它 sibling 仍在跑": 资源浪费, 也违反 v0 Bash 串行语义
    - "primary LLM fallback 时 in-flight tool_use 残留": fallback 模型下一轮看到 orphan tool_use
    - "inputsEquivalent 缺工具级默认": ContentReplacementState 缓存 invalidation 不准确
  hypothesis:
    - per-input IsConcurrencySafe 必须分层混合: interface + 4 工具 override + 15 工具 default
    - toAutoClassifierInput 必须有 fail-safe: parse failure → raw input + emit metric
    - AutoModeClassifier P2 interface 先就位, metric 触发再升 P1 实施
    - GrowthBook 保留 1 flag (bash 30K→50K), 其他推迟等真实 ops 需求
    - Bash sibling abort: watched call 失败时 cancel 其它 watched sibling, 复用 errgroup 并行路径
    - StreamingToolExecutor.Discard: 把 in-flight tool_use 合成 streaming_fallback result, 喂给 fallback 模型
    - inputsEquivalent 19 工具默认: per-tool 等价性, 跟 ContentReplacementState 联动
  propose_options:
    - A (DO): 5 PR 收口 — ToolSurface v4 + partition + toCompactBlock + AutoModeClassifier stub + Bash sibling abort
    - B (partial): 仅 PR-A + PR-B, 不动 PR-F (sibling abort + discard)
    - C (rejected): 把 6 PR 拆 6 PR, 违反 devrix hotfix 模式
  risk:
    - ToolSurface v4 interface 扩展是 breaking change, 19 surface 全部需要 override (mitigation: 15 工具走 default helper)
    - AutoModeClassifier P2 stub 可能被 caller 误用 (mitigation: panic 信息明确 + TODO 注释)
    - Bash sibling abort 跟现有 watcher 协议可能冲突 (mitigation: 只 watched tools 参与, 默认 bash)
    - Discard on fallback 跟 streaming_fallback 命名不一致 (mitigation: sentinel constant)
  out_of_scope:
    - LLM SideQuery 5s timeout + retry (D3 域自治, 域交叉)
    - AutoModeClassifier P1 实施 (metric 触发再立 change)
    - Classifier-driven microcompact (跟 D2/T13 PerMessageBudget 联动, P2)
    - 多 LLM ensemble (P3)
    - 跨 session reputation → classifier input (P2)
    - 工具 progress 流 (TD-STE-04, P2)
    - synthetic error 统一 (TD-STE-05, P2)
    - Filter v2 workspace 维 (P1 独立 change)
    - GrowthBook flag 运行时热切换一致性 (Codex Round 1 B3, "理论上不该发生" 边际收益低)
    - metric emit 幂等 (同一 error 多次 emit 去重, Codex Round 1 B2)
