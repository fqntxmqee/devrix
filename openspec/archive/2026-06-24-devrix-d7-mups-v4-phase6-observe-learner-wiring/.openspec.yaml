# 能力维度
capabilities:
  - id: D7-S12-A41
    name: ObserveRequest + IntentQuantizer + AnomalyDetector + ClassifyWithPrior (Observer 子模块 + WithPrior 变体)
    description: |
      Phase 6 PR-F1 (D7-S12-A41-T01/T02/T03) 闭环 Phase 5 PR-E5 E5.4 T13 PARTIAL。
      (1) orchtypes/observe_request.go ObserveRequest struct 3 字段 (SessionID + Message +
      Prior *learn.AdaptivePrior) + NewObserveRequest fail-fast 校验 + EffectivePrior()
      返回 DefaultDeveloperPrior 兜底 + Validate()；
      (2) orchtypes/intent_quantizer.go IntentQuantizer struct + 4 IntentClass 枚举
      (IntentClassFact / IntentClassCommand / IntentClassOrchestrate / IntentClassSkip)
      + IntentPayload 4 字段 (Class + Confidence + Reason + SubClass) +
      Quantize baseline + QuantizeWithPrior (prior.PriorBeta.Mean() 作为 confidence
      乘数, clamp [0,100])；
      (3) orchtypes/anomaly_detector.go Anomaly + AnomalyReport + AnomalyDetector +
      HistoricalDetector + Detect baseline + DetectWithPrior (threshold = 0.5 × mean,
      Mean 越高阈值越高 = 更信任用户 = 更易放过异常)；
      (4) decisionplanning/classifier.go RuleClassifier.ClassifyWithPrior (在 Classify
      baseline 上叠加 prior.PriorBeta.Mean() 乘数) + IntentClassifier 接口扩展
      ClassifyWithPrior 方法 (RuleClassifier + ShadowClassifier + 测试 mock 均实现)。
      不可变模式: prior 不被 Observer 子模块修改, EffectivePrior 返回新对象。
    rationale: |
      Phase 5 PR-E5 T13 PARTIAL 续。Observe 节点需要 WithPrior 变体才能消化 LP-1
      注入的 AdaptivePrior。3 通道观察 (intent / anomaly / classify) 是 Phase 2
      PR-A1 4×4 象限的具体 Observer 实现。
  - id: D7-S12-A42
    name: SessionOrchestrator.buildObserveRequest + WithLearner + 3 层 fail-safe
    description: |
      Phase 6 PR-F2 (D7-S12-A42-T04/T05) 闭环 Phase 5 LP-1 读侧入口。
      (1) sessionorchestrator/orchestrator.go 新增 `learner learn.Learner` 字段 +
      `WithLearner(l learn.Learner) OrchestratorOption` (懒构造 default learner)；
      (2) 新增 `buildObserveRequest(ctx, req) (orchtypes.ObserveRequest, error)` 方法:
      调用 o.learner.Inject 拿 AdaptivePrior → 3 层 fail-safe (nil learner /
      Inject error / 正常路径) → 统一返回 DefaultDeveloperPrior Beta(5,3) 兜底；
      (3) ProcessMessage 在 classifySpan 之前调用 buildObserveRequest, 把
      observeReq.Prior 传给 classifier.ClassifyWithPrior (替换原 Classify)；
      (4) ShadowClassifier.ClassifyWithPrior 委托给底层 rule.ClassifyWithPrior
      (LP-1 不影响 shadow 异步路径, 保持 sample 可比性)；
      (5) IntentClassifier 接口扩展 ClassifyWithPrior 方法, 既有 RuleClassifier
      / ShadowClassifier / 测试 mock 全部实现。
    rationale: |
      LP-1 节点级落地最后一步。Learner.Inject → AdaptivePrior → Orchestrator
      → 3 Observer 子模块 形成 5 节点管道 Observe → Plan → Execute → Verify →
      Learn → 下一轮 Observe 的关键回写路径。
  - id: D7-S12-A43
    name: LP-1 闭环 E2E 集成测试 (4 scenarios)
    description: |
      Phase 6 PR-F3 (D7-S12-A43-T06) 端到端验证 LP-1 + LP-5 跨域集成。
      tests/integration/d7/learn_observe_closure_test.go 4 E2E 测试:
      (1) TestE2E_LP1_ClosedLoop_LearnPassAccumulatePrior — 3 × VerdictPass 累积
      Alpha=3, Round 2 观察 Beta(8,3) Mean=8/11 ≈ 0.727;
      (2) TestE2E_LP1_ClosedLoop_IndeterminateParseFailure_NoAlphaPollution —
      ⭐G8-1 fix: VerdictIndeterminate + verifier_parse_failure 仅
      VerifierFailureCount++, Alpha/Beta 不污染, Round 2 仍 Beta(5,3) 冷启动;
      (3) TestE2E_LP1_ClosedLoop_PendingAssetScheduledMemory — ⭐LP-2:
      VerdictIndeterminate + env_limited → PendingAsset 仅在 ScheduledMemory,
      不在 Skill/Feedback, ListDue 在 TriggerAt 之后返回;
      (4) TestE2E_5NodePipeline_End2End — ⭐LP-5: 完整 5 节点 1 轮端到端 +
      反向追溯 (Plan.SourceObservationIDs / Verdict.SourceArtifactID /
      Asset.SourceSessionIDs)。
      使用 in-memory mocks (InMemoryReputationStore + 3 Memory 通道 +
      recordingExecutor + recordingClassifier), 无外部 LLM/D2/D3 依赖。
    rationale: |
      Phase 5 PR-E5 T13 PARTIAL 闭环验证。E2E 集成测试比 unit test 更能证明
      LP-1 闭环在真实 orchestrator wiring 下 work (Observe → ClassifyWithPrior
      → Engine → Verdict → Learn → ReputationStore → 下一轮 Inject → 再 Observe)。

