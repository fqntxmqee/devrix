metrics_definitions:
  - name: interfaces_task_spec_coverage
    type: gauge
    labels: [call_site]
    description: TaskSpec 覆盖率（3 处创建点：plan.New / channel.New / workitem.New）
  - name: taskreport_dissent_recorded_count
    type: counter
    labels: [verdict_kind, session_id_hash]
    description: TaskReport.Dissent 字段填充次数（触发条件 = VERDICT=INDETERMINATE 或 fallback_used=true）
  - name: pessimistic_commit_trigger_count
    type: counter
    labels: [trigger_reason, session_id_hash]
    description: Pessimistic Commit 触发次数（trigger_reason = escape_force_exit | budget_exhausted）
  - name: pessimistic_commit_mvp_artifact_size
    type: histogram
    labels: [artifact_kind]
    description: MVPArtifact 大小分布（KB）
  - name: worktree_versionchain_length
    type: gauge
    labels: [workitem_id_hash]
    description: WorkItem.VersionChain 平均长度（target ≤ 10 / session）
  - name: similarity_check_intercept_count
    type: counter
    labels: [intercept_reason]
    description: Similarity Check 拦截次数（intercept_reason = parent_child_similarity_high）
  - name: hard_evidence_reject_count
    type: counter
    labels: [verifier_kind, missing_evidence]
    description: Hard Evidence 拒绝次数（missing_evidence = no_test | no_log | no_artifact_hash）
  - name: cross_domain_boundary_test_count
    type: gauge
    labels: [domain_pair]
    description: 跨域 boundary_test.go 套件大小（domain_pair = D2-D7 | D4-D7 | D6-D7）
span_naming:
  - taskreport.dissent_recorded
  - taskreport.blockage_recorded
  - taskreport.resource_recorded
  - pessimistic.commit.emit
  - worktree.versionchain.append
  - worktree.versionchain.gc
  - similarity.check.intercept
  - hard.evidence.reject
  - convergence.feasible_space_width
  - interfaces.task_spec.created
  - interfaces.task_report.created
