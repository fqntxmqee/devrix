      Phase 3 PR-C2 是 MUPS v4.3 Phase 3（Execute 节点）的第二步，
      紧接 PR-C1（Artifact 数据契约）。本 PR 单独成立的原因：
      (a) 4 Channel + ChannelRouter 是 Phase 3 7 PR 拆解（PR-C1..C7）
      中 PR-C2..C7 的执行入口；(b) Channel 抽象使得后续 PR-C3 StrategyDecider
      可以插桩在 ChannelRouter.Route 与 Channel.Execute 之间；(c) PlanKind →
      ArtifactKind 1:1 映射是 D5 dashboard 字符串过滤的基础；(d) 4 Channel
      共享 ToolRunner interface 解耦 PR-C4 ToolSpec v3，PR-C2 可独立落地
      不依赖后续 PR。

