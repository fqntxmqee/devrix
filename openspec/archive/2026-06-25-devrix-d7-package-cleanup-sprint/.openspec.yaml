capabilities:
  - id: D7-S6-A50
    name: D7 子包清理热身 Sprint (4 遗留小子包物理合并)
    description: |
      v6.0.0 域升级（DM-20260626-001/002/003/004/005/007）已经把 D7 编排层从
      14 S 精简为 6 S + 1 横切（hardening），并把大型子包（turn/、execute/、learn/、
      exit_reason/、observe/）做了物理合并。

      本 Sprint 是 v6.0.0 follow-up 序列收尾热身：清理剩余 4 个小子包遗留
      （runregistry/、toolpolicy/、sessionqueue/、d7spans/），每个只有 2-3 个文件、
      零独立测试价值。每个子包做物理合并（git mv + import 路径替换 + package 改名），
      不改任何函数签名、不动任何业务逻辑。

      **0 行为变化** (pure physical migration)：4 子包 importer 变 in-package，
      路径更短；D7 编排 15 → 11 子目录；hardening 5 → 7 文件；executionflow 父级
      0 → 4 文件（+session_queue.go + 2 test + doc.go）。
    rationale: |
      v6.0.0 follow-up 序列（大 PR #218 + #220 + #222 + #225-#228 + #164-#169 +
      #170-#173）已完成 14 S → 6 S + 1 横切的目录结构博弈角色对齐。但 4 个小子包
      是 v6.0.0 之前的"逻辑分离"产物，遗留目录浏览噪音：
      (a) 读 D7 目录需要下钻一层才知道逻辑，14 个子目录 = 6 S + 1 横切 + 4 遗留
          + 3 工具（escape/mups/wavescheduler）；
      (b) import 路径碎片化：workmodel/run_spawn.go 已 import workmodel 父包却还要
          import runregistry 子包（同级不同包，跨包访问）；
      (c) 新成员认知负担：每个子包都要解释一次"为什么独立"；
      (d) review 噪音：4 个子包导致 4 个独立的 import graph 节点需要 review。
      合并后 D7 编排层目录结构目标态（11 子目录 = 6 S + 1 横切 hardening + 4 工具
      [decisionplanning/delegatetools/escape/orchtypes/plan/sessionorchestrator/
      wavescheduler/mups]）。

