# 能力维度
capabilities:
  - id: D7-S10-A32
    name: VerdictKind typed enum + AggregateVerdicts (G3-1)
    description: |
      Phase 4 Verify 节点的 G3-1 数据契约层。(1) shared/types/verdict.go 引入
      VerdictKind 4 态 typed enum (VerdictPass/Partial/Indeterminate/Fail) +
      String/Parse/MarshalJSON/UnmarshalJSON + 空字符串零值兼容 (VerdictPass)
      向后兼容 Phase 2 UncertaintyCoord.FromVerifier 内联字符串 switch；
      (2) workmodel/aggregate_verdicts.go 引入 AggregationStrategy 4 策略
      (WeakConjunction/StrongConjunction/Majority/ThresholdByPass) +
      AggregateVerdicts 函数 + 边界处理 (空切片 → VerdictIndeterminate，
      单元素 → 直接返回，同质 → 直接返回) + 4 With* 不可变方法。
      orchtypes/uncertainty_coord.go 通过 type alias `type VerdictKind =
      types.VerdictKind` 重新导出，避免 import cycle。
    rationale: |
      DM-20260623-002 立项需求。Phase 2 PR-A1 FromVerifier 内联字符串 switch
      替换为 typed enum switch；与 Phase 3 PR-C1 SideEffectStatus precedent
      一致 (跨域类型上提 shared/types)。
  - id: D7-S10-A33
    name: VerdictToExitReason + 14 ExitReason + G8-1 P0-3 修复
    description: |
      (1) turn/verdict_to_exit_reason.go VerdictToExitReason 4 Verdict →
      4 ExitReason 映射 + SystemAnomaly 覆盖 (ExitReasonSystemAnomaly)；
      (2) turn/orchestrator.go ExitReason 8 → 14 扩展 (6 新 enum:
      partial_verified/verifier_abstain/verifier_fail/system_anomaly/
      unresolved/abstain) + ParseExitReason + AllExitReasons；
      (3) workmodel/verify_with_retry.go VerifyWithRetry parse failure →
      INDETERMINATE (NOT error, NOT FAIL) — G8-1 P0-3 bug 修复。
    rationale: |
      G8-1 P0-3 修复。原 parser 失败 → error → orchestrator 误判为 FAIL；
      修复后 parse failure → INDETERMINATE → ExitReasonVerifierAbstain →
      人工复核。混淆 "parser problem" 与 "verdict problem" 是 P0 风险。
  - id: D7-S10-A34
    name: Evidence struct + EvidenceExtractor
    description: |
      (1) workmodel/evidence.go Evidence struct 5 字段
      (Reason/Confidence/Counterexample/SourceRef/ExtractedAt) +
      NewEvidence 工厂方法 (必填字段 fail-fast) + Validate +
      WithCounterexample + WithConfidence 不可变 + MarshalJSON/UnmarshalJSON；
      (2) workmodel/evidence_extractor.go EvidenceExtractor interface
      (Extract + Validate) + LLMEvidenceExtractor (list form + single
      form fallback) + StubEvidenceExtractor (test double)。
    rationale: |
      Phase 5 Learn 节点的输入数据契约。本 PR 仅定义 Evidence 数据结构
      + EvidenceExtractor 抽象；具体调用方在 PR-D4 wiring + Phase 5 PR-E1..E5
      集成。
  - id: D7-S10-A35
    name: SystemAnomaly 异常聚合 + ObserveNode wiring
    description: |
      (1) workmodel/system_anomaly.go AnomalyCategory interface (避免
      orchtypes ↔ workmodel import cycle) + CatBusinessValue/CatSystemValue
      uint8 常量 + SystemAnomalyConfig {AnomalyThreshold, MinCatSystemRatio}
      + SystemAnomalyAggregator (sync.Mutex guarded RecordCatSystem/Reset) +
      DefaultAnomalyThreshold=3 + DefaultMinCatSystemRatio=0.5 +
      EvaluateSystemAnomalyFromCategories 无状态包装；
      (2) orchtypes/system_anomaly_wiring.go observationAdapter (在
      orchtypes 包内, 其中 workmodel → orchtypes 单向依赖已存在) +
      AsWorkmodelAnomalyCategories + EvaluateSystemAnomaly(report) +
      BuildUncertaintyCoordFromReport (Observe→Verify→Coord 统一入口)。
      SystemAnomaly=true 强制 UncertaintyCoord.Value=0.95。
    rationale: |
      闭环 Phase 2 PR-A1 缺失的 SystemAnomaly wiring。Phase 2 FromVerifier
      的 systemAnomaly 参数始终为 false，导致 Phase 3/4 调用方无法传播
      系统异常信号。本 PR 闭合该 wiring：SystemAnomaly=true → FromVerifierTyped
      强制 Value=0.95 → 高不确定性 → 触发 ExitReasonSystemAnomaly。

# 测试点（PR-D1..D4 实际实现 8 个）
test_points:
  - id: D7-S10-A32-T01
    name: |
      VerdictKind 4 态 typed enum (VerdictPass/Partial/Indeterminate/Fail)
      + String() + ParseVerdictKind() + MarshalJSON + UnmarshalJSON +
      空字符串零值兼容 (VerdictPass 向后兼容)。
    status: IMPLEMENTED
  - id: D7-S10-A32-T02
    name: |
      AggregationStrategy 4 策略枚举 + AggregateVerdicts 函数 +
      边界处理 (空切片 → VerdictIndeterminate，单元素 → 直接返回，
      同质 Kind → 直接返回) + 4 With* 不可变方法 + 4 策略
      (WeakConjunction OR / StrongConjunction AND / Majority / ThresholdByPass)
      完整覆盖。
    status: IMPLEMENTED
  - id: D7-S10-A33-T03
    name: |
      VerdictToExitReason 4 Verdict → 4 ExitReason 映射 + SystemAnomaly=true
      覆盖 (返回 ExitReasonSystemAnomaly) + 14 ExitReason 8 → 14 扩展
      (6 新增: partial_verified / verifier_abstain / verifier_fail /
      system_anomaly / unresolved / abstain) + ParseExitReason +
      AllExitReasons。
    status: IMPLEMENTED
  - id: D7-S10-A33-T04
    name: |
      VerifyWithRetry parse failure → INDETERMINATE (NOT error, NOT FAIL) —
      G8-1 P0-3 修复 + DefaultMaxParseRetries=3 + RetryCount 记录尝试次数。
    status: IMPLEMENTED
  - id: D7-S10-A34-T05
    name: |
      Evidence struct 5 字段 (Reason/Confidence/Counterexample/SourceRef/
      ExtractedAt) + NewEvidence 必填字段 fail-fast + Validate 强制
      3 不变式 (Reason/SourceRef 非空 + Confidence ∈ [0,1]) + WithCounterexample
      + WithConfidence 不可变 + MarshalJSON/UnmarshalJSON wire format。
    status: IMPLEMENTED
  - id: D7-S10-A34-T06
    name: |
      EvidenceExtractor interface 2 方法 (Extract + Validate) +
      LLMEvidenceExtractor 实现 (list form + single form fallback +
      ctx cancel propagation + 缺 SourceID 占位) +
      StubEvidenceExtractor 实现 (test double)。
    status: IMPLEMENTED
  - id: D7-S10-A35-T07
    name: |
      SystemAnomalyAggregator 阈值触发
      (AnomaliesCount ≥ AnomalyThreshold AND CatSystem/AnomaliesCount
      ≥ MinCatSystemRatio) + RecordCatSystem 累积 + Reset 清空 +
      DefaultAnomalyThreshold=3 + DefaultMinCatSystemRatio=0.5 +
      EvaluateSystemAnomalyFromCategories 无状态包装。
    status: IMPLEMENTED
  - id: D7-S10-A35-T08
    name: |
      ObserveNode wiring SystemAnomaly → FromVerifierTyped 统一入口 +
      BuildUncertaintyCoordFromReport(report, verifier) 集成 +
      SystemAnomaly=true 强制 UncertaintyCoord.Value=0.95 (override
      VerdictPass baseline)。
    status: IMPLEMENTED

