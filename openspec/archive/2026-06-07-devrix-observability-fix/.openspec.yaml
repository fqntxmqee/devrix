bug_severity:
  critical:
    - gauge-float64-conversion    # Gauge float64 → uint64 转换精度丢失
    - async-gauge-counter-race    # AsyncGauge/Counter 回调并发无保护
    - histogram-double-cumulative # Histogram 双重累积导致 Prometheus 输出错误
    - shutdown-no-flush           # TracerProvider.Shutdown 未刷写 pending spans
  high:
    - updown-counter-is-counter   # Int64UpDownCounter 返回 Counter 而非 Gauge
    - shutdown-missing-metrics    # Shutdown 遗漏 Logger 组件
    - registry-reset-incomplete   # Registry.Reset 未重置 Gauge/Histogram
    - handler-missing-close       # Handler 接口缺少 Close 方法
    - dead-mutex                  # Counter 中未使用的 sync.Mutex
    - log-sampling-unimplemented  # 日志采样配置存在但未实现
  medium:
    - error-log-no-stacktrace     # 错误日志无堆栈跟踪
    - bubble-sort-in-registry     # sortedKeys 使用冒泡排序
    - exporter-interface-mismatch # ConsoleExporter 未实现 SpanExporter
    - null-export-batch-dead      # NullExporter.ExportBatch 不在接口中
    - weak-unit-tests             # 部分测试无实际断言

