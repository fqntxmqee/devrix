# 能力维度
capabilities:
  - id: D7-S11-A36
    name: LearningAsset 5 类 + AssetContent + LearningClass 5 枚举
    description: |
      Phase 5 Learn 节点的核心数据契约。(1) internal/shared/types/learning.go
      引入 LearningClass 5 态 typed enum (LearningSOP/LearningProtocol/
      LearningKnowledge/LearningConclusion/LearningPending) + String/Parse/
      MarshalJSON/UnmarshalJSON + 空字符串零值兼容 (LearningSOP 默认)；
      (2) learn/learning_asset.go LearningAsset struct 15 字段
      (ID/SessionID/Class/Strength/SourceSessionIDs/SourceVerdictIDs/Content/
      AssetKey/ContentHash/FailureCriterion/ExpiryAt/CreatedAt/LastUsedAt/
      UseCount/TraceID) + 不可变 deep copy + 自动时间戳；
      (3) learn/asset_content.go 5 类 AssetContent 实现 (SOPAssetContent ★5 /
      ProtocolAssetContent ★4 / KnowledgeAssetContent ★3 /
      ConclusionAssetContent ★2 / PendingAssetContent ⭐★1) + Validate() +
      SchemaVersion() + ByteSize() + 必填字段 fail-fast；
      (4) PendingAssetContent 新增 MVEState 字段 (nullable *execute.MVEState)
      + Question + Options 支持 Learn 节点 ↔ Execute MVE checkpoint 互通。
      learn/learning_asset.go 通过 type alias `type LearningClass =
      types.LearningClass` 重新导出，避免 import cycle。
    rationale: |
      DM-20260623-003 立项需求。Phase 5 Learn 节点的最小入口；与 Phase 3
      SideEffectStatus + Phase 4 VerdictKind precedent 一致 (跨域类型上提
      shared/types)。
  - id: D7-S11-A37
    name: ReputationEvidence + Bayesian Update + Wilson Score + G8-1 修复
    description: |
      (1) learn/reputation_evidence.go ReputationEvidence struct 12 字段
      (SessionID/TrackMode/Alpha/Beta/Mean/Variance/ConfidenceLow/
      ConfidenceHigh/LastUpdated/UpdateCount/SourceVerdictIDs/
      VerifierFailureCount/IndeterminateCount) + 不可变 + Wilson Score 95% 置信
      区间 + 冷启动除零防御；(2) BayesianUpdate(prior, verdict) 函数实现
      Pass/Partial→α++ / Fail→β++ / Indeterminate 分支处理；(3) ⭐G8-1 P0-3
      修复 (Phase 4 VerifyWithRetry parse failure → INDETERMINATE) 的 Learn
      端延伸：verdict.IndeterminateReason=="verifier_parse_failure" 时仅
      VerifierFailureCount++，绝不动 α/β；避免 LLM 输出格式异常污染用户信誉。
    rationale: |
      G8-1 P0-3 修复（DM-20260623-002 Phase 4 VerifyWithRetry parse failure
      → INDETERMINATE）的 Learn 端延伸。混淆 "用户行为失败" 与 "Verifier
      输出格式问题" 是 P0 信誉风险。
  - id: D7-S11-A38
    name: AdaptivePrior + DefaultPriors + BuildAdaptivePrior
    description: |
      (1) learn/adaptive_prior.go AdaptivePrior struct 3 字段 (Reputation +
      PriorBeta + InjectTargets) + BetaPrior (Alpha + Beta + String "Beta(α,β)")
      + InjectTarget 3 枚举 (InjectIntentQuantizer/InjectHistoricalDetector/
      InjectRuleClassifier) + 不可变；(2) DefaultDeveloperPrior = Beta(5,3) +
      DefaultOperatorPrior = Beta(8,1) + DefaultInjectTargets 3 个；(3)
      BuildAdaptivePrior(rep, trackMode) Bayesian 合并公式 + rep==nil 兜底 +
      trackMode=="" 兜底 (默认 Developer)。
    rationale: |
      LP-1 闭环的"读"侧入口 (Learn 节点 → 下一轮 Observe)。Phase 2 PR-A1
      UncertaintyReport.ComputeOverallStrength 与 AdaptivePrior.PriorBeta
      形成 Bayesian 双源：用户历史信誉 (Alpha/Beta) + 当前 UncertainCoord。
  - id: D7-S11-A39
    name: Memory 3 通道接口 + 3 实现（LP-2 隔离）
    description: |
      (1) learn/memory.go Memory interface 4 方法 (Store/Retrieve/Delete/List)
      + MemoryChannel 3 枚举 (MemorySkill/MemoryFeedback/MemoryScheduled) +
      MemoryFilter 4 字段 (Class/SessionID/MinStrength/Expired) +
      allowedClasses() 编译期保证 LP-2 通道 ↔ LearningClass partition；
      (2) SkillMemory (LearningSOP + LearningProtocol) + FeedbackMemory
      (LearningKnowledge + LearningConclusion) + ScheduledMemory
      (LearningPending) 3 实现 + ScheduledRetry envelope (Asset/TriggerAt/
      RetryCount/MaxRetries/LastRetryAt) + IsExhausted() + ListDue(now)；
      (3) filterAssets 共享 helper (Class/SessionID/MinStrength/Expired 4 维
      过滤) + sync.RWMutex 并发安全 + LP-2 ErrAssetClassMismatch 路由错位
      兜底；(4) DefaultScheduledMaxRetries=3 (matches PendingAssetContent
      validator upper bound)。
    rationale: |
      LP-2 隔离原则落地。5 类 LearningAsset ↔ 3 通道 Memory partition：
      确定性 Skill (★4-5) / 软知识 Feedback (★2-3) / 延迟重试 Scheduled
      (★1)。通道错位 (e.g. SOP 写入 FeedbackMemory) → fail-fast
      ErrAssetClassMismatch。
  - id: D7-S11-A40
    name: Learner interface + DefaultLearner + AssetBuilder + ReputationStore + LP-1 闭环
    description: |
      (1) learn/learner.go Learner interface 3 方法 (Learn/Inject/ScheduledTick)
      + DefaultLearner struct 6 字段 (3 Memory + ReputationStore + AssetBuilder
      + BayesianUpdater 可注入) + Learn 5 步流程 (class 选择 → AssetBuilder →
      Memory 路由 LP-2 → ScheduledMemory 兜底 → BayesianUpdate LP-3) + Inject
      流程 (ReputationStore.Get → BuildAdaptivePrior LP-1) + ScheduledTick 流程
      (TriggerAt ≤ now → RetryCount++ → MaxRetries 耗尽 → FeedbackMemory 警告
      escalation) + 4 Verdict → 5 LearningClass 路由 (Pass→SOP/Partial→
      Protocol/Fail→Knowledge/Indeterminate→Pending)；
      (2) learn/asset_builder.go AssetBuilder 5 类 Content 构造 + classToStrength
      5 等级映射 + hashContentBytes SHA-256 hex 截断 16 + AssetKey 格式
      ({class}:{sourceID}:{hash}) 幂等去重；
      (3) learn/reputation_store.go ReputationStore interface 3 方法
      (Get/Update/List) + InMemoryReputationStore 默认实现 (sync.RWMutex 并发
      安全 + defensive copy)；
      (4) in-package LP-1 闭环测试 (Learn ×3 Pass → ReputationStore.Alpha=3 →
      Inject → AdaptivePrior.PriorBeta = Beta(8,3) = Developer Beta(5,3) +
      rep(3,0)) 替代 spec 中 Observe.QuantizeWithPrior/DetectWithPrior/
      ClassifyWithPrior 跨域 wiring 留待 Phase 6 集成。
    rationale: |
      LP-1 闭环节点级落地。Learner.Inject 是 5 节点管道 Observe → Plan →
      Execute → Verify → Learn → 下一轮 Observe 的关键回写入口。
      AssetBuilder 把 Plan/Observation/Artifact 跨域信息归一为 LearningAsset；
      ReputationStore 累积跨会话信誉；LP-1 闭环测试证明 Alpha 累积 → Bayesian
      合并公式正确。

