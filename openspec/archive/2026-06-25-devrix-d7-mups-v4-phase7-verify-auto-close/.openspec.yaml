  - id: D7-S13-A48-T04
    name: |
      ProcessRequest 新增 TrackMode string 字段 (默认 "" 兜底 developer) +
      TrackModeDeveloper / TrackModeOperator 常量 + NewProcessRequest
      fail-fast 校验 + 3 个 sentinel error (ErrProcessRequestSessionIDEmpty
      / ErrProcessRequestMessageEmpty / ErrProcessRequestInvalidTrackMode)
      + 8 个单测覆盖 zero value + fail-fast + 各合法/非法值。
    status: IMPLEMENTED
  - id: D7-S13-A48-T05
    name: |
      buildObserveRequest 透传 req.TrackMode → o.learner.Inject(ctx, sessionID,
