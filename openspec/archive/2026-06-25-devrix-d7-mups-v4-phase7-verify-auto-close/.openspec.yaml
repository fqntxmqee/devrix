      Beta(8,1) Mean=0.889，Developer → Beta(5,3) Mean=0.625，空字符串/未知
      → 兜底 Developer) + 6 个 TrackMode 单测覆盖 operator/developer/empty/
      invalid/DefaultLearner cold-start。
    status: IMPLEMENTED
  - id: D7-S13-A49-T06
    name: |
      sessionSpan 6 prior attributes (alpha/beta/mean/track_mode/classifier_source
      /injected_at) 全部写入 + priorSessionSpanAttrs 纯 helper 便于单元测试
      + 5 个单测覆盖 real injection 5 attributes + cold_start_failsafe 标记
      + TrackMode hint resolution + Reputation wins over hint + 字符串类型
      校验。
    status: IMPLEMENTED

