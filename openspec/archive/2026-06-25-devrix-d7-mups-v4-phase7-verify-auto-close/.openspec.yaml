# 能力维度
capabilities:
  - id: D7-S13-A47
    name: SessionOrchestrator.processAutoClose — Verify→Learn 运行时闭环
    description: |
      Phase 7 PR-7.1 (D7-S13-A47-T01/T02/T03) 闭环 Phase 6 PR-F3 E2E 测试中
      手工模拟的 Verify→Learn 步骤，**生产 SessionOrchestrator.ProcessMessage
      自动触发 learner.Learn**。
      (1) sessionorchestrator/autoclose.go 新增 `processAutoClose(ch, sessionCtx,
      sessionID, intent) <-chan *contracts.EngineEvent` 私有方法，包装路径
      channel，启动 goroutine 透传 events，channel 关闭后调用 synthesizeVerdict
      + o.learner.Learn(LearnRequest{Verdict, SessionID}) 异步；
      (2) sessionorchestrator/autoclose.go 新增 `synthesizeVerdict(last, sessionID)
      *workmodel.Verdict` 私有函数：complete → VerdictPass / error → VerdictFail
      (Reason=event.Content) / tombstone → VerdictIndeterminate
      (IndeterminateReason="interrupt") / 其他 Type → nil；
      (3) orchestrator.go 替换 `endSpanWhenChannelClosed(ch, sessionSpan)` 改为
      `o.processAutoClose(ch, sessionCtx, sessionSpan, req.SessionID, intent)`，
      保持 span 关闭语义不变；
      (4) 3 层 fail-safe：nil learner → 透传 endSpanWhenChannelClosed /
      Learn error → slog.Warn + skip / channel 提前关闭 → slog.Warn + skip，
      永不阻塞 ProcessMessage 同步返回；
      (5) IntentSkip 路径不调用 processAutoClose（无执行结果可学）；
      (6) AssetBuilder Auto-Close fallback：当 req.Plan/Artifact 为 nil 时，
      `extractSOPName` 返回 `sop:autoclose:<SourceID>` + `extractStepsFromPlan`
      返回 `["autoclose-completion"]` 合成步骤，保证 LP-1 闭环在生产中真实可
      走通。
    rationale: |
      Phase 6 PR-F3 E2E 测试 `learn_observe_closure_test.go:204-214` 在测试代码里
      手工循环调用 Learn 模拟了闭环，但生产代码路径上这一步是缺的。本次 PR-7.1
      把这一步补上，让 5 节点管道在生产运行时自动闭环，ReputationStore 真正
      跨会话累积。
  - id: D7-S13-A48
    name: ProcessRequest.TrackMode — Operator 角色支持 + buildObserveRequest 透传
    description: |
      Phase 7 PR-7.2 (D7-S13-A48-T04/T05) 暴露 Phase 5 PR-E5 E5.3 已定义的
      DefaultOperatorPrior Beta(8,1)。
      (1) orchtypes/process.go 新增 `TrackMode string` 字段到 ProcessRequest
      (`""` 表示 developer 兜底) + `TrackModeDeveloper = "developer"` /
      `TrackModeOperator = "operator"` 常量 + `NewProcessRequest(sessionID,
      message, trackMode string)` fail-fast 构造函数；
      (2) orchtypes/errors.go 新增 3 个 sentinel error:
      ErrProcessRequestSessionIDEmpty / ErrProcessRequestMessageEmpty /
      ErrProcessRequestInvalidTrackMode；
      (3) learn/learner.go 扩展 `Inject(ctx, sessionID, trackModeHint string)`
      签名，新增 3 层解析策略：(a) prior.Reputation.TrackMode != "" → 用 rep；
      (b) hint ∈ {"", "developer", "operator"} → 用 hint；(c) 其他 → slog.Warn
      + 兜底 Developer；
      (4) orchestrator.go buildObserveRequest 调用 `o.learner.Inject(ctx,
      req.SessionID, req.TrackMode)` 透传 hint 到 BuildAdaptivePrior；
      (5) DefaultLearner.Inject TrackMode operator → DefaultOperatorPrior
      Beta(8,1) Mean=0.889，developer → Beta(5,3) Mean=0.625。
    rationale: |
      Phase 5 PR-E5 E5.3 (D7-S11-A38-T07) 已定义 `DefaultOperatorPrior Beta(8,1)`
      但 Orchestrator 没用上，PR-7.2 暴露这个能力给 caller（D1 gateway 飞书
      适配器层未来版本可按用户角色注入 TrackMode），3 层 fail-safe 保持
      Operator 角色支持不影响 Developer 兜底。
  - id: D7-S13-A49
    name: sessionSpan 6 prior attributes — D5 可观测化增强
    description: |
      Phase 7 PR-7.3 (D7-S13-A49-T06) 扩展 sessionSpan trace 信息。
      (1) sessionorchestrator/tracing.go 新增 `priorSessionSpanAttrs(prior,
      observeReq, req)` 纯 helper 函数返回 5 attributes：
      - learn.prior.alpha (string, e.g. "8")
      - learn.prior.beta (string, e.g. "1")
      - learn.prior.mean (string "%.3f", e.g. "0.889")
      - learn.prior.track_mode (string, "developer" / "operator")
      - learn.prior.injected_at (string, "phase6_lp1" / "cold_start_failsafe")
      (2) 第 6 个 attribute `learn.classifier_source` (string, "rule" /
      "shadow") 在 ProcessMessage classifySpan 关闭前直接 mirror；
      (3) TrackMode 3-tier 解析 (prior.Reputation 优先 > req.TrackMode hint >
      "developer" 兜底) 在 helper 内部统一；
      (4) injected_at 标识: `observeReq.Prior != nil` → "phase6_lp1" (真实注入)
      否则 "cold_start_failsafe" (DefaultDeveloperPrior 兜底)。
    rationale: |
      Phase 6 PR-F2 只加了 alpha/beta 两个数字，运维同学 trace 排查时看不出
      prior 是真实注入还是冷启动兜底，看不出 classifier 用的是 rule 还是
      shadow。6 字段一气呵成让 trace 排查一目了然，Jaeger UI 自然支持。

