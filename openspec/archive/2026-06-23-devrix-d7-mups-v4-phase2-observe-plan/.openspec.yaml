# 测试点（PR-A1 + PR-RF 实际实现 6 个）
test_points:
  - id: D7-S8-A15-T01
    name: |
      Observation 4 类（ObsFact/ObsSignal/ObsDeviation/ObsUncertainty）+ 2 Category
      (CatBusiness/CatSystem) + sealed Payload interface（4 concrete types）
      + 不可变（WithKind/WithStrength 返回新副本）+ Strength ∈ [0,1] +
      DetectedAt 非零 + JSON roundtrip。
    status: IMPLEMENTED
  - id: D7-S8-A15-T02
    name: |
      UncertaintyReport ComputeOverallStrength 仅遍历 CatBusiness Observations
      （不包含 CatSystem，避免系统异常污染整体 Strength）+ CatSystem 缺失时 defaults half (0.5)。
    status: IMPLEMENTED
  - id: D7-S8-A15-T03
    name: |
      UncertaintyCoord Phase 2 增量扩展：FromVerifier 工厂方法 + IsColdStart + Equal + With* +
      Phase 1 JSON wire format 向后兼容（FromVerifier=false + SideEffectStatus="" 零值）
      + MarshalJSON 用 omitempty 不写零值字段 + 未知 verdict 失败兜底 + FromVerifier fail-fast
      (ORCH_COORD_VERDICT_7004 错误码)。
    status: IMPLEMENTED
  - id: D7-S8-A15-T04
    name: |
      UncertaintyReport Partition 不变式强制保证（CatBusiness ∪ CatSystem == Observations）
      + 违反不变式返回 ErrUncertaintyReportPartitionInvariant + 空 Observations 边界。
    status: IMPLEMENTED
  - id: D7-S8-A15-T05
    name: |
      UncertaintyReport FilterByKind 故意遍历全集（不限 Category），返回所有指定 Kind 的
      Observation（不论 CatBusiness 或 CatSystem），便于 Phase 4 Verify 阶段跨异常类别聚合。
    status: IMPLEMENTED
  - id: D7-S8-A15-T06
    name: |
      Observation 不可变 + 字段校验（Strength ∈ [0,1] panic on out-of-range +
      validateFact/FailureCriteria 包装 fmt.Errorf + MarshalJSON wire format 嵌套对象
      + UnmarshalJSON graceful degrade）。
    status: IMPLEMENTED

