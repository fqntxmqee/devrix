    message: Dissent entry rejected: Reason empty
    remediation: append entry with non-empty Reason
    ac_ref: AC3
  - code: ORCH_RESOURCE_INVALID
    message: Resource field invalid: tokens/time/step < 0
    remediation: producer must validate positive values
    ac_ref: AC5

