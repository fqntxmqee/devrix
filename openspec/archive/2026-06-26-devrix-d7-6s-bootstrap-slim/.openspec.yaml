      v6.0.0 follow-up #6 (6s-bootstrap-slim) 落地。
      把 `internal/bootstrap/wire_coordinator.go` InitOrchestration 函数 (275 行) 内部
      散落的 3 个 adapter 函数 (newContextEngineAdapter + newTurnOrchExecutor +
      newGatewayEventPublisher) 拆到独立文件 `internal/bootstrap/adapters.go`，
      4 个 util 函数 (boolPtr + intPtr + strPtr + mapBackgroundStatus) 拆到
      `internal/bootstrap/util.go`，30 行 config 加载抽到 `loadOrchestratorConfigs()`
      辅助函数；新增 `WireDecisionPlanning` 和 `WireMUPSPipeline` 包装让 6 S × WireFunc
      命名一致；让 InitOrchestration 主体降到 ≤ 200 行 6 S 组合入口清晰。

      **0 行为变化** (pure refactor, InitOrchestration 外部接口 + 内部 S 层调用顺序
      100% 不变)；调用方 0 变化 (cmd/devrix + cmd/obs-verify + tests/testutil/d7_stack.go
      0 改动)；hardening/ + escape/circuit_breaker.go + sessionorchestrator/autoclose.go
      git diff 0 变化 (baseline stability 保持)。

      本次是 v6.0.0 follow-up 序列的**最终收官 PR**:
      5/6 S7_Archived + 1/6 S1_Cancelled (observe-merge) + 1/1 S7_Archived (本次)。
    rationale: |
      v6.0.0 域升级 14 S → 6 S + 1 横切博弈角色对齐后，bootstrap 拓扑应同步收口。
      当前 InitOrchestration 275 行混杂 config 加载 + 6 S 构造 + 3 个内嵌 adapter
      + 4 个 util，文件组织与 6 S 博弈角色不直接对应：
      (a) 6 S wire 函数命名不一致：S2 (WireTurnInvoker) + S3 (WireWaveScheduler) +
          S4 (WireExecutionFlow) 已有 Wire* 命名，但 S5 (LLMDecomposer inline) +
          S6 (TurnToolExecutor+SubTurnRunner inline) 没有 Wire* 包装；
      (b) 3 个内嵌 adapter 函数无独立文件 → 不可单测；
      (c) 4 个 util 函数散落 + 52 行 config 加载 inline → InitOrchestration 函数体
          读起来像"流水账"；
      (d) 横切 Hardening (Discipline Keeper) 的 wire 入口未明确文档化 (当前是
          `d7spans.SetBridge` 隐式调用，新人难以理解)。
      收口后 6 S 拓扑可读性 +1 + 可测试性 +1 + 可演进性 +1 + 文档对齐 +1。

