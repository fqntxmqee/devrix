    description: |
      MUPS v4.3 Phase 2 Plan 节点的数据契约层（PR-B1）。落地：
      (1) 新建 internal/layers/orchestration/plan 包；
      (2) PlanKind 4 类枚举（CommitmentPlan / ProtocolPlan / ScenarioPlan /
      ExplorationPlan）+ snake_case wire format + MarshalJSON/UnmarshalJSON
      + ParsePlanKind CLI 反向解析；
      (3) BlastRadius（FileCount/APICallCount/TokenCost/PersistScope 3 态）
      + FailureCriterion（PP-2 可证伪性）+ Step（IdempotencyKey）；
      (4) Plan struct + 不可变 With* 模式（WithKind/WithStrength/WithFailureCriteria/
      WithBlastRadius/WithAnomaliesCount）+ Validate() 强制 PP-1 强度范围 + PP-2
      FailureCriteria 非空 + Op 白名单 + Field 可观察 + PP-3 BlastRadius 阈值；
      (5) ReverseLookupObservations Phase 4 Verify 反向追溯入口；
      (6) Planner interface + DefaultPlanner + PlanInput struct + MatchKind
      4 规则分类器（intent_orchestrate/high-anomaly/single-step/
      intent_command+multi-step/scenario-default）+ uncertainty-first tie-break；
      (7) strengthFloor 公式（0.7 base − 0.1·anomalies + min(observations·0.02, 0.2)）；
      (8) 9 SentinelError + 3 helpers（PLAN_KIND_8001 / PLAN_LINEAGE_8002 /
      PLAN_BLAST_8003）。
    rationale: |
      Phase 2 PR-B1 是 MUPS v4.3 Phase 2（Observe → Plan → Execute）的第二步，
      也是 PR-RF（C2/W8 MatchKind 签名收紧）的落点。本 PR 单独成立的原因：
      (a) Plan 4 类 + Planner interface 是 Phase 3 PR-C2 ChannelRouter 的直接
      依赖；(b) Plan.SourceObservationIDs 是 Phase 4 Verify 反向追溯的入口；
      (c) C2/W8 决议：MatchKind 签名收紧为 `(*UncertaintyReport)`，从 PR-A1
      stub（`[]Observation`）升级，避免后续 PR-C2 再次破坏 API；
      (d) PlanKind wire format 与 shared/types.ArtifactKind（PR-C1）同款
      snake_case 约定，D5 dashboard 字符串过滤可统一。

