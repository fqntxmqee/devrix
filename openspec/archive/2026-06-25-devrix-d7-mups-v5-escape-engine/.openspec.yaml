  - D7  # orchestration

# 能力维度
capabilities:
  - id: D7-S14-A50
    name: LoopDepthTracker v2 + PlanKindSwitchPolicy + ChainedArbitrator (LLM/Rule/Human) + EscapeEngine + CircuitBreaker 5 层 + AuditLog + 5 节点接线
    description: |
      MUPS v5 回路深度统一逃逸机制 (doc 38 §21 完整设计落地):
      (1) V5.1 LoopDepthTracker v2 — LoopContext 7 字段 (SessionID + PlanKind + ObservationKind +
      FailureCriterion + ArtifactType + LoopIteration + CumulativeCost) + SHA-256 hashLoopContext +
      History 隔离 + depth >= MaxDepth 触发 ForceExit + Reset;
      (2) V5.2 PlanKindSwitchPolicy 3 档 — Allowed/Constrained(<=4 累计)/Forbidden +
      累计计数 + 切换阈值矩阵 (4 IntentKind x 4 PlanKind);
      (3) V5.3 ChainedArbitrator LLM/Rule/Human + Notifier + PendingResolution — EscapeAction
      6 类 (Continue/EscalateToRule/EscalateToHuman/ForceExit/AbortWithAudit/PendingHuman) +
      EscapeDecision 9 字段 (5 core + 4 audit) + LLM 5s timeout + Rule 同步 + Human 异步 +
      panic recovery + FeishuCardNotifier + ChainedNotifier + PendingResolutionStore;
      (4) V5.4 EscapeEngine + CircuitBreaker 5 层 + AuditLog — Engine 整合 13 类失败降级矩阵 +
      LoopBudget (consecutive=3 / total=20) + CircuitBreaker L0..L5 (L0 AnomalyDetector 5 nil /
      L1 DispatchLoopWakeups 100/min / L2 Verifier 3x>2s / L3 Hook 5 fail / L4 WorkerPanic 1 /
      L5 SandboxExit 5 fail) + EscapeAuditLog 14 ExitReason 映射 + 14 gap 补测;
      (5) V5.5 5 节点接线 (Orchestrator 1a/1b/2 + unit + integration) — 3 接线点 1a Plan fails
      + 1b Plan 前 + 2 Execute fails + processEscapeDecision signature `(bool, error)`
      透传 augmented err (C-1 fix) + 1a 短路 (ForceExit/PendingHuman 不入 EscapeEngine) +
      8 unit wiring tests + 5 integration 4IntentKind tests + 1 new
      TestProcessEscapeDecision_AugmentsError;
      (6) S4-Gate review C-1/C-2/C-3 修复 — processEscapeDecision `bool` → `(bool, error)`
      透传 augmented error + T12 ResumeSession 标记 PARTIAL 留待 PR-V5.6 + 根 t-registry
      同步 v4.7.0→v4.8.0。
    rationale: |
      doc 38 §21 关键漏洞: v4 缺乏统一逃逸机制,各类失败 (Loop depth / Plan kind switch /
      Verifier timeout / Hook failure / Worker panic) 各自逃逸,缺乏统一决策 + 仲裁 + 降级
      矩阵 + 电路保护 + 审计。V5 落地后,所有逃逸路径走 EscapeEngine → ChainedArbitrator →
      ExitReason/Asset, 5 节点管道具备 13 类失败降级能力 + 5 层断路器保护 + 14 退出原因可审计。
      T12 ResumeSession 续跑 SessionOrchestrator 入口留待 PR-V5.6 (1 天工作量, V5.3 存储层
      HumanArbitrator.ResumeSession 已落地)。

