# 能力维度
capabilities:
  - id: D7-S6-A48
    name: channel.route Span (S6 MUPS Pipeline P0)
    description: |
      v6.0.0 6 S 精简新增 P0 Span。在 ChannelRouter.Route 入口发射 D7_Channel_Route
      Span (session_id / channel.kind / plan.kind / score / fallback)，让 Jaeger
      记录 channel 选择路径（commit / protocol / scenario / exploration）和
      fallback 决策。Plan.Strength (float64 [0,1]) 用 3-decimal 格式字符串化。
    rationale: |
      14 S 阶段未补齐的 core-link Span 之一。ChannelRouter 是 S6 MUPS
      Pipeline 角色的关键决策点（4 通道 1:1 映射），无 Span 覆盖时 D7
      Execute 路径在 Jaeger 看不到入口选择。
  - id: D7-S6-A49
    name: memory.persist Span (S6 MUPS Pipeline P0)
    description: |
      v6.0.0 6 S 精简新增 P0 Span。在 SkillMemory.Store 入口发射
      D7_Memory_Persist Span (session_id / channel / asset.kind / ttl_ms /
      payload_size)，让 Jaeger 记录 LP-2 三通道（skill/feedback/scheduled）
      的资产持久化。ttl_ms 来自 ttlRemainingMs helper，payload_size 来自
      assetPayloadSize helper（AssetKey + ContentHash + SessionID 长度加总）。
    rationale: |
      14 S 阶段未补齐的 core-link Span 之一。SkillMemory 是 S6 Memory
      Curator 角色的核心存储（3 通道 LP-2 隔离），无 Span 覆盖时
      Learn 节点持久化路径在 Jaeger 看不到资产分类。
  - id: D7-S4-A47
    name: system.anomaly_detect Span (S4 ExecutionFlow+Verify P0)
    description: |
      v6.0.0 6 S 精简新增 P0 Span。新增 executionflow/verify/anomaly.go
      package + DetectSystemAnomaly 函数，发射 D7_System_Anomaly_Detect
      Span (anomaly.kind / severity / threshold / evidence_id)。4 AnomalyKind
      常量预留 v6.1 (cat_system_aggregate / rate_spike / quota_exceeded /
      schema_violation / verifier_abstain_loop)，4 Severity (none / low /
      medium / high) 由 ratio 派生。
    rationale: |
      14 S 阶段未补齐的 core-link Span 之一。S4 Certifier 角色是 anomaly
      分类的核心判定点，无 Span 覆盖时 system anomaly 在 Jaeger 看不到
      严重程度和 kind 分类。保持 LP-1 兼容：wrapper 复用
      orchtypes.EvaluateSystemAnomaly 避免破坏 Phase 4 PR-D4 的
      UncertaintyCoord Value=0.95 路径。
  - id: D7-S5-A33
    name: taskgraph.synthesize Span (S5 DecisionPlanning+Observe P1)
    description: |
      v6.0.0 6 S 精简新增 P1 Span。在 TaskDecomposer.SynthesizeTaskGraph
      入口发射 D7_TaskGraph_Synthesize Span (session_id / node_count /
      edge_count / dag_depth / cycle_detected)。新增 dagDepth helper 计算
      最长路径 BFS，cycle 时 cap 在 len(nodes)。
    rationale: |
      14 S 阶段未补齐的 core-link Span 之一。S5 Information Producer
      角色的核心是合成 task DAG，无 Span 覆盖时 Plan 节点在 Jaeger
      看不到 DAG 拓扑（节点数/边数/深度/是否有环）。在 validation 后
      emit，cycle_detected 是 validated truth 而非 raw input。
  - id: D7-S5-A34
    name: executor.select Span (S5 DecisionPlanning+Observe P1)
    description: |
      v6.0.0 6 S 精简新增 P1 Span。在 WaveScheduler.dispatchOne 入口发射
      D7_Executor_Select Span (candidates_count / selected_kind / score /
      policy="kind_match")。当前 selection 是 map lookup（runner by
      WorkerType），score 1.000/0.000 二态。
    rationale: |
      14 S 阶段未补齐的 core-link Span 之一。S5 Information Producer
      角色 + S3 WaveScheduler 的衔接点，selection 路径在 Jaeger 看不到
      candidate pool size 和命中与否。

