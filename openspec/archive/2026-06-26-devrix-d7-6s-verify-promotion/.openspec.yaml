  - id: D7-S4-A50
    name: Verify 包归属 promote (exit_reason + verdict_to_exit_reason 从 sessionorchestrator/ → executionflow/verify/)
    description: |
      v6.0.0 follow-up #4 (6s-verify-promotion)。把 D7 编排层中临时留存在
      `sessionorchestrator/` 包内的 3 文件 (`exit_reason.go` 72 行 +
      `verdict_to_exit_reason.go` 49 行 + `verdict_to_exit_reason_test.go` 97 行,
      共 218 行) 物理 promote 到 `executionflow/verify/`。
      DM-20260626-004 (`devrix-d7-6s-package-merge`) 把 turn/ → sessionorchestrator/
      时为避免单 PR scope 膨胀 (60 文件), 3 个 Verify-衍生文件临时留 sessionorchestrator/;
      本次独立 PR 收口, 0 函数签名变化 (pure physical migration)。
      promote 后 S4 ExecutionFlow + Verify (Costly Signaler + Certifier) 角色的
      可验证承诺 (14 ExitReason + VerdictToExitReason 4 态映射) 在 spec 层与代码层
      完全对齐。
    rationale: |
      v6.0.0 域升级 follow-up 序列的物理包收口（#1 spec + #2 mups + #3 hardening +
      #4 turn-merge + 本次 #5 verify-promotion）。
      S4 ExecutionFlow + Verify (Costly Signaler + Certifier) 是单一博弈角色,
      但 `ExitReason` 14 枚举值里 6 个 (partial_verified / verifier_abstain /
      verifier_fail / system_anomaly / unresolved / abstain) 是 Phase 4 Verify
      升格后新增的 Verify-derived stop conditions, 代码侧全在 sessionorchestrator/
      导致:
      (a) 角色与代码归属不对齐: S4 Certifier 的可验证承诺在 spec 层与代码层脱钩;
      (b) `VerdictToExitReason` 跨角色调用方向反了: 未来 verify/anomaly.go 调用
          `sessionorchestrator.VerdictToExitReason` 是 S4 → S2 反向依赖 (Certifier
          是 S4, SessionOrchestrator 是 S2, S4 不应依赖 S2 实现细节);
      (c) 测试点归属错位: verdict_to_exit_reason_test.go 5 个 test function 测试
          Certifier 行为, 但 package sessionorchestrator 与 A 层 D7-S10-A33
          VerdictToExitReason 注册到 S4 不一致;
      (d) follow-up #6 (6s-bootstrap-slim) wire 14 → 6 收敛的前置条件。
      promote 后 S4 Certifier 单一包封装恢复, 跨包 DAG 单向 (sessionorchestrator → verify)。

