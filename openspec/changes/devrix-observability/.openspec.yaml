metrics_definitions:
  - name: devrix_llm_tokens_total
    type: Counter
    labels: [provider, model, direction]
  - name: devrix_llm_latency_seconds
    type: Histogram
    labels: [provider, model]
  - name: devrix_llm_errors_total
    type: Counter
    labels: [provider, model, error_type]
  - name: devrix_tool_calls_total
    type: Counter
    labels: [tool, risk_level, status]
  - name: devrix_session_active
    type: Gauge
    labels: [adapter]
  - name: devrix_permission_timeouts_total
    type: Counter
    labels: []
  - name: devrix_permission_decisions_total
    type: Counter
    labels: [decision]
  - name: devrix_context_tokens_current
    type: Gauge
    labels: [session_id]

span_naming:
  conventions:
    - operation: message.receive
      attributes: [adapter, session_id]
    - operation: llm.chat
      attributes: [provider, model, tokens]
    - operation: tool.execute
      attributes: [tool.name, risk_level]
    - operation: permission.request
      attributes: [tool_name, timeout]
    - operation: context.compress
      attributes: [before_tokens, after_tokens]
    - operation: session.create
      attributes: [adapter]
    - operation: session.expire
      attributes: [session_id, reason]

label_policy:
  allowlist:
    - provider
    - model
    - adapter
    - tool
    - risk_level
    - status
    - direction
    - decision
    - error_type
  blocklist:
    - session_id
    - user_id
    - api_key

