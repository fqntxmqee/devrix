  - name: orchestration.task.duration_ms
    type: histogram
    description: "Per-task execution duration in milliseconds"
  - name: orchestration.intent.confidence
    type: histogram
    description: "Intent classification confidence score (0-100)"
span_naming:
  - operation: d7.session.process
    description: "D7-S2-A01 ProcessMessage entry span"
  - operation: d7.intent.classify
    description: "D7-S5-A01 ClassifyIntent span"
  - operation: d7.plan.synthesize
    description: "D7-S5-A02 SynthesizeTaskGraph span"
  - operation: d7.task.dispatch
    description: "D7-S1-A02-F01 DispatchTask span"
  - operation: d7.flow.publish
    description: "D7-S4-A01 PublishFlowEvent span"
