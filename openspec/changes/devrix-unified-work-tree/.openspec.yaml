version_scope:
  v1.0:
    features:
      - "WorkItem + WorkTree 核心模型与 DiskWorkItemStore v2"
      - "TaskManager 委托 WorkTree（legacy Task 兼容）"
      - "v1 Task JSON 自动迁移"
      - "CI static analysis 防产权侵蚀（AC23）"
    status: planned
  v1.1:
    features:
      - "Session goal + delegate/plan 写 parent_id"
      - "todo_write → checklist 子节点"
      - "Wave TaskNode → WorkItem 视图"
      - "Code Owner Bot（AC24）"
    status: planned
  v1.2:
    features:
      - "RunRegistry 挂接 WorkItem.RunRef（依赖 DM-011 Phase 1）"
      - "QueryWorkPlan 树形读模型"
      - "季度 Property Rights Audit（AC25）"
    status: planned
  v1.5:
    features:
      - "最小递归引擎 — RunTurn 单层 focus→decompose→spawn→await→continue"
      - "基础 uncertainty（LLM claim only）"
      - "task_await 基础实现"
      - "depth=1 硬编码（单层递归）"
    note: "⭐ 新增里程碑：让 WorkTree 从静态树变成活的任务循环"
    status: planned
  v2.0:
    features:
      - "task_write/spawn/await/list tool rename（alias 期）"
      - "多层递归 decompose（depth ≤ 3）"
      - "Uncertainty Anchor 机制（AC27）"
      - "递归深度/宽度约束（AC20-22）"
      - "删 legacy flat Task / TaskNode / sc.Todos"
    status: planned
  v2.1:
    features:
      - "跨 Session WorkItem 只读查询"
      - "历史 WorkItem lock 协议"
      - "跨 Session mutable 引用 + arbitration"
      - "飞书卡片历史任务摘要"
    note: "任务生命周期超越单 Session"
    status: planned
  v3.0:
    features:
      - "自适应 Uncertainty 阈值（基于用户/项目历史学习）"
      - "WorkItem Kind 自动检测 + 提议协议"
      - "跨项目任务模板提取与复用"
      - "WorkTree 结构自优化（terminal 率反馈）"
    note: "任务系统从静态机制设计进化为学习的机制设计"
    status: planned

