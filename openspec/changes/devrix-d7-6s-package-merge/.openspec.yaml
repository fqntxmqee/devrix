# 能力维度
capabilities:
  - id: D7-S2-A50
    name: SessionOrchestrator 物理包扩展 (turn/ + autoclose → sessionorchestrator/)
    description: |
      v6.0.0 follow-up #3 (6s-package-merge)。把 D7 编排层中独立存在的 `turn/` 子包
      (25 .go, 6467 行, 包含 DefaultOrchestrator + RunTurn 主循环 + 11 个核心 type + 6 个核心函数)
      物理合并到 `sessionorchestrator/` 包。`sessionorchestrator/autoclose.go` 已在 #1 落地。
      物理合并后 sessionorchestrator/ 包扩展到 ~60 文件 ~15000 行，对应 S2 SessionOrchestrator
      (Mediator + Turn Leader + Error Recovery) 复合博弈角色。
      exit_reason.go (72 行) + verdict_to_exit_reason.go (49 行) + verdict_to_exit_reason_test.go
      (97 行) 临时随 turn/ 迁入 sessionorchestrator/，由后续 follow-up #4
      (devrix-d7-6s-verify-promotion) 从 sessionorchestrator/ promote 到 executionflow/verify/。
      hardening/recovery.go 已是 receiver methods 子集 (4 纯函数 + 1 const 已迁 hardening/)，
      迁 sessionorchestrator/ 时 hardening/ 调用 0 变化。
    rationale: |
      v6.0.0 域升级 follow-up 序列的物理包收口（#1 spec + #2 mups + #3 hardening + 本次 turn 合并）。
      S2 SessionOrchestrator = Mediator + Turn Leader + Error Recovery 是单一博弈角色，
      但代码侧 turn/ 子包独立存在导致：
      (a) 目录命名与博弈角色不对齐；
      (b) turn_tools.go 已在 sessionorchestrator/，但 turn/orchestrator.go 还在 turn/，
          导致 sessionorchestrator/ 包内部职责不完整；
      (c) bootstrap wire_coordinator.go 中需分别 wire turn.NewOrchestrator 与
          sessionorchestrator.NewSessionOrchestrator 两个独立包，未来 6 S 全部落地后
          还需要再做一次 wire 收敛；
      (d) turn/ 11 个核心 type 跨包调用频繁（12 个 importer），打破 S2 单包封装。
      物理合并后 S2 单包封装恢复，#6 (devrix-d7-6s-bootstrap-slim) 14 wire → 6 wire
      的前置条件 #4 完成。

