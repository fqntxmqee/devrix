    - ProbeToolChannel 的 Bounded(n) + PromptPressure 是 LLM 自我循环的根治
    - Verify input contract 4 元组强校验 deliverable mandatory + 按 EmissionClass 分配 burden of proof
    - verdict.Reason 透传 meta 全链路到 D1 feishu 渲染 + Learn FeedbackMemory 最小接入
