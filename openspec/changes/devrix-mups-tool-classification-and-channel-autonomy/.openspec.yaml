# 设计原则锚定 (从 6 轮对话合成)
design_principles:
  P1: "元数据是 control plane, 不是声明标签"
  P2: "每个 tool 是 self-bounded actor, 节点是协同编排器"
  P3: "LLM 的自我循环必须由工具层 iteration_bound 强收敛"
  P4: "Verify 节点有 input contract, deliverable mandatory + burden of proof by class"
  P5: "Verdict 全链路透传到 D1 + Learn FeedbackMemory, 禁止中途丢失"
  P6: "截断必须对 LLM 透明, 禁止欺骗 LLM"
  P7: "4 类正交分解必须从节点级下沉到 tool 级"

# 博弈论双 review 共识 (Codex + Composer, 2026-07-01)
game_theory_consensus:
  H1: "emission_class + 4 control plane 字段 = 类型揭示 (cheap talk 风险, H10 解)"
  H2: "4 ToolChannel 按 emission_class 路由 = 菜单设计 (OnResult 行为重分类, H9 解)"
  H3: "L4-L6 termination invariant = 可执行承诺 (与 L0-L3 cross-check, H8 解)"
  H4: "Bounded(n) hard reject + PromptPressure = SPE 均衡 (单 session) + reputation (跨 session, H7 解)"
  H5: "VerifyContract 4 元组 + 按 EmissionClass 举证 = 多维契约补全"
  H6: "verdict.Reason 透传 D1 + Learn FeedbackMemory 最小接入 = 分布式 Bayesian 链起点"
  H7: "目标均衡双声明: 单 session SPE + 跨 session reputation equilibrium"
  H8: "LTL-Lite L4-L6 与 L0-L3 安全 invariant cross-check (≥3 条)"
  H9: "PlanKind × EmissionClass 交叉一致性 + OnResult 行为重分类 (call_count>3 → 升级 Probe)"
  H10: "emission_class cheap talk 审计: Phase C 最小 (verify_exit_reason) + Phase E 完整 drift"
  H11: "Phase B shadow mode: would_reject log-only, FP<5% 再硬切"
  H12: "PR-A 禁止 silent metadata default: 缺 EmissionClass CI fail, read_file/grep/glob 显式 Probe+Bounded(15)"

