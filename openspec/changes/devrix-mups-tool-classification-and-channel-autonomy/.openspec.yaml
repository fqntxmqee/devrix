    - D7 Verify 节点只判现有 deliverable, 无 input contract 强校验
    - verify_exit_reason 在 session_complete.go 局部变量丢失
  hypothesis:
    - 4 类正交分解 (Fact/Action/Probe/Experiment) 必须从 MUPS 节点级下沉到 tool metadata 级
