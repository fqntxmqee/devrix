notes: |
  本 Change 是 devrix-d7-observe-llm-protocol-doc 的兄弟 spec, 沿用同模板。
  Plan 节点与 Observe 节点的关键差异:
  1. 走 prompttags 反射 (pt struct tag) + buildStrategicPlanFrame 显式条件, **无 N→M 显式过滤**
  2. 输出是单对象 rawStrategicPlan, 非数组
  3. LLM 决定 execution_mode (3 选 1), Go 端 MatchKind 决定 PlanKind (4 选 1)
  4. 混合场景: single + 高 UncertaintyMean + hasHighStrengthFact → applySingleModeUncertaintyGate bypass
  5. Plan 节点零 trace-level e2e bannered test (对比 observe 16 个), 5 test 补足
