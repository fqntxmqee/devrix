scope:
  layers:
    - id: L4
      name: Multi-Agent
      affected: true
    - id: L1
      name: Communication
      affected: true
      reason: "CommunicationGateway 注入 IAgentFactory"
    - id: L2
      name: Context Engine
      affected: false
      reason: "Agent 委托 IContextEngine，不修改 L2"

  capabilities:
    - id: AGT-FACTORY
      name: Agent factory + config validation
    - id: AGT-LIFECYCLE
      name: State machine Run/Wait/Terminate
    - id: AGT-FORKJOIN
      name: Parallel child agents (max 3)
    - id: AGT-COLLAB
      name: Collaboration mode prompt enhancement
    - id: AGT-PERMISSION
      name: Permission delegation to PermissionManager
    - id: AGT-OBSERVER
      name: Agent events → IObserver adapter
    - id: AGT-BOOTSTRAP
      name: WireMultiAgent in bootstrap

  l5_test_points:
    - L5-4-1-01  # AgentFactory 创建 Agent 实例
    - L5-4-2-01  # Agent 生命周期状态转换
    - L5-4-2-02  # 工具风险等级映射，CRITICAL 触发权限
    - L5-4-2-03  # 权限管线授权/拒绝/超时流程
    - L5-4-3-01  # Fork/Join 子 Agent 创建+并行+合并
    - L5-4-3-02  # Fork 数超限 MaxChildren 拒绝
    - L5-4-3-03  # Agent 超时自动终止
    - L5-4-3-04  # Context 取消传播到子 Agent
    - L5-4-4-01  # CoT prompt 增强
    - L5-4-4-02  # Iterative-Refinement prompt 增强
    - L5-4-5-01  # ObserverAdapter 桥接 AgentEvent → IObserver
    - L5-4-0-01  # Agent 并发安全 (-race)
    - L5-4-0-02  # SessionContext 共享写入安全
    - L5-4-0-03  # PermissionManager 集成全流程
    - L5-4-0-04  # E2E Fork 端到端

