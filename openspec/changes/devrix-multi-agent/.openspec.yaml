    - L5-4-3-03  # Agent 超时自动终止
    - L5-4-3-04  # Context 取消传播到子 Agent
    - L5-4-4-01  # CoT prompt 增强
    - L5-4-4-02  # Iterative-Refinement prompt 增强
    - L5-4-5-01  # ObserverAdapter 桥接 AgentEvent → IObserver
    - L5-4-0-01  # Agent 并发安全 (-race)
    - L5-4-0-02  # Fork 消息隔离并发安全
    - L5-4-0-03  # Gateway → Agent.ResolvePermission 集成全流程
    - L5-4-0-04  # E2E Fork 端到端

