version_scope:
  v1.0:
    features:
      - "Agent 生命周期状态机 (CREATED→RUNNING→ITERATING→WAITING_PERMISSION→TERMINATED)"
      - "Fork/Join 子 Agent (V1 简化版，同步 Wait+Join，共享 *SessionContext)"
      - "CollaborationMode prompt 增强 (CoT / Iterative-Refinement / Default)"
      - "权限委托 gateway.PermissionManager"
      - "Observer 适配器桥接到 contextengine.IObserver"
      - "Bootstrap WireMultiAgent 引导集成"
    status: s2_design
    tasks: T1-T16
    estimate: 40h
  v1.1:
    features:
      - "Fork 异步化（不阻塞父 Agent 迭代）"
      - "子 Agent 数量可配置"
    status: future
  v2.0:
    features:
      - "Supervisor-Worker 模式"
      - "完整 COW SessionContext"
      - "Agent 持久化 + 恢复"
    status: future
  v3.0:
    features:
      - "Peer-Review 模式"
      - "Vote-Consensus 模式"
      - "Full Fork/Merge + Milestone DAG"
    status: future

