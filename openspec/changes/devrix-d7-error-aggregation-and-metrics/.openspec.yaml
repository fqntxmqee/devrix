author: orchestrator (deep review session)

# DSAFT 层归属
layers:
  - D7  # orchestration
  - D5  # observability (metrics 接线)

# 能力维度（devrix-error-handling-tier1-tier2 风格）
capabilities:
  - id: D7-S6-A11
    name: HandleInterrupt error aggregation
    description: Aggregate errors from Wave/D4/Process cancelers via errors.Join, return aggregated error instead of nil
  - id: D7-S6-A12
    name: Worktree cleanup observability
    description: Sandbox Exit / worker panic / taskCtx leak / reentry cancel 全部走 metric + slog.Warn，不静默吞
  - id: D7-S6-A13
    name: Forker batch error surfacing
    description: DefaultForker.Fork 的并发失败用 errors.Join 取代 errs[0] 单点返回

# 测试点（占位，S4 实现时按需补充）
test_points:
  - id: D7-S6-A11-T01
    name: HandleInterrupt 4-step cancel 全部失败 → 返回 errors.Join(error1, error2, error3)
    status: PLANNED
  - id: D7-S6-A12-T01
    name: Sandbox Exit 失败 → metric.Inc("sandbox_exit_failed") + slog.Warn 不返回 err
    status: PLANNED
  - id: D7-S6-A12-T02
    name: Worker panic → metric.Inc("worker_panics")（不是仅 slog.Error）
    status: PLANNED
  - id: D7-S6-A12-T03
    name: taskCtx leak 检测 → completeTask 时如果 cancel != nil && ExitCode == 0 → metric.Inc("task_ctx_leaked")
    status: PLANNED
  - id: D7-S6-A13-T01
    name: Forker 3 个并发失败 → 返回 errors.Join(err1, err2, err3) 而非 errs[0]
    status: PLANNED

