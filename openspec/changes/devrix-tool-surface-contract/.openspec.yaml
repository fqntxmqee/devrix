version_scope:
  v1.0: |
    工具装配整体收编为 shared/contracts 拆面契约层。
    - internal/shared/contracts.ToolSurface 4 方法 interface
    - internal/shared/contracts.ToolFilter 1 方法 interface
    - 7 个 surface 实现就位（Builtin / LSPTool / FreeFork / Tracker / Verify / Delegate / BackgroundTask）
    - 3+ 个 filter 实现就位（PerAgent / PerRisk / Composite + toolpolicy 适配）
    - 3 入口收编为 1 入口（NewContextEngine 接受 []ToolSurface）
    - 6+ global singleton 全删（两阶段：先收敛后删除）
    - turn_adapter.ExecuteRound 走 surface.Execute（与 D2 legacy query/executor 同链路）
    - per-agent ⊇ main 等价性回归测试守护
  v1.1: |
    阶段 2 增强（本期不交付）：
    - PerSessionFilter（per-session allow/deny 单点 tool）
    - devrix tool list 增强（--risk / --mode flag）
metrics_definitions:
  - name: tool_surface_global_var_count
    description: 工具相关 package-level global var 数量
    target: 0
    baseline: 6+
  - name: tool_bootstrap_entry_count
    description: bootstrap 入口数（tool 注册相关）
    target: 1
    baseline: 3
  - name: per_agent_tool_coverage_pct
    description: per-agent 模式可见 tool 集合 / main 模式可见 tool 集合
    target: 100
    baseline: ~50  # 实际当前已全部注册，但无回归测试守护
  - name: turn_adapter_surface_path_pct
    description: turn_adapter.ExecuteRound 走 ToolSurface.Execute 的比例
    target: 100
    baseline: 0    # 当前走 a.tools.Execute 旁路
  - name: tool_p0_test_pass_rate_pct
    description: 工具相关 P0 T 测试点通过率
    target: 100
    baseline: 100  # 既有 13 个 P0 T 点（DM-002 wiring）全绿
span_naming:
  - TOOL-SURFACE-1-A01: tool.surface.contract
  - TOOL-SURFACE-1-A02: tool.filter.contract
  - TOOL-SURFACE-1-A03: tool.surface.<name>.execute
  - TOOL-SURFACE-1-A04: tool.filter.<name>.apply
  - TOOL-SURFACE-1-A05: tool.bootstrap.surface_assembly
