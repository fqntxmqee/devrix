name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same PR/branch (avoids queue pile-up on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify dependency versions (DM-20260618-007 W0)
        run: |
          # Lock mvdan.cc/sh/v3 to v3.x to avoid silent v4 major-version upgrades.
          # `go list -m` outputs "<module> <version>" (e.g. "mvdan.cc/sh/v3 v3.13.1").
          # Extract the version column (last whitespace-separated token).
          mod_out="$(go list -m mvdan.cc/sh/v3 2>/dev/null || echo MISSING)"
          actual="${mod_out##* }"
          case "$actual" in
            v3.*) echo "mvdan.cc/sh/v3 locked at $actual (OK)" ;;
            *) echo "::error::mvdan.cc/sh/v3 must be locked to v3.x (got: $actual; full: $mod_out)"; exit 1 ;;
          esac

      - name: Unit tests
        env:
          CI_COVERAGE: "1"
        run: ./scripts/test-unit.sh

      - name: Eval fast check (mock judge)
        run: ./scripts/eval/run-eval.sh

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out

  gate:
    name: gate (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            script: ./scripts/test-integration.sh
          - suite: e2e
            script: ./scripts/test-e2e.sh
          - suite: acceptance
            script: ./scripts/test-acceptance.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.script }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download coverage profile
        uses: actions/download-artifact@v4
        with:
          name: coverage-out

      - name: Coverage threshold
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
          echo "Total coverage: ${total}%"
          echo "::notice::Coverage target is 80% (project.md). Raise CI gate when baseline improves."
          min=20
          awk -v c="${total}" -v m="${min}" 'BEGIN { exit !(c+0 >= m+0) }' || {
            echo "::error::Coverage ${total}% is below minimum ${min}%"
            exit 1
          }

      - name: Coverage by domain (D1-D5)
        run: ./scripts/coverage-domains.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-reports/
