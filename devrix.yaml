# Devrix 配置文件
# 文档: https://github.com/devrix/devrix/docs/config.md

# 应用配置
app:
  name: "devrix"
  version: "2.0.0"
  mode: "cli"  # cli | server | daemon

# 会话配置
session:
  idle_timeout: "30m"
  storage_dir: "~/.devrix/sessions"
  max_sessions: 1000

# 认证配置
auth:
  secret: "change-me-in-production"
  token_expiry: "24h"
  issuer: "devrix"

# 权限配置
permission:
  default_timeout: "60s"
  max_retries: 3

# 连接配置
connection:
  heartbeat_interval: "10s"
  heartbeat_timeout: "60s"

# 限流配置
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst_size: 10

# CLI 配置
cli:
  welcome_message: |
    ╔═══════════════════════════════════════════════════════════════╗
    ║                    Devrix v2.0 - 开发大脑                    ║
    ║            多智能协同开发助手 (Multi-Agent CLI)               ║
    ╚═══════════════════════════════════════════════════════════════╝
  prompt: "> "
  ansi:
    user: "\x1b[34m"
    assistant: "\x1b[32m"
    error: "\x1b[31m"
    warning: "\x1b[33m"
    reset: "\x1b[0m"

# 命令配置
commands:
  prefix: "/"
  list:
    - "new"
    - "stop"
    - "help"

# 飞书配置
feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  bot_name: "Devrix"
  domain: ""  # 自定义域名，留空使用飞书默认
  encrypt_key: ""
  callback_path: "/feishu/webhook"
  port: "8080"
  use_webhook: false

# 实例配置（用于集群部署）
instance:
  id: ""  # 留空自动生成
  name: "devrix"
  address: ""
  port: 0
  cluster_enabled: false

# 日志配置
logging:
  level: "debug"  # debug | info | warn | error
  format: "json"  # json | text
  output: "stdout"  # stdout | stderr | file

# Metrics 配置
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# 上下文引擎配置 (Layer 2)
context_engine:
  max_context_tokens: 128000
  reserved_output_tokens: 8192
  tool_result_budget: 800
  compression_enabled: true
  pev:
    max_iterations: 3
    verify_mode: "basic"
  snapshot:
    enabled: true
    backup_dir: "~/.devrix/context"
  system_prompt:
    sources:
      - "AGENTS.md"
      - ".devrix/AGENTS.md"
    fallback: "You are Devrix, a multi-agent development assistant."

# 可观察层配置 (Observability Layer)
observability:
  enabled: true

  tracing:
    enabled: true
    service_name: "devrix"
    service_version: "2.0.0"
    exporter: "otlp"  # console | otlp | null
    sampling:
      type: "always_on"  # always_on | always_off | trace_id_ratio
      rate: 1.0  # 0.0-1.0 (仅 trace_id_ratio 模式使用)
    otlp:
      endpoint: "http://localhost:4318/v1/traces"
      insecure: true
      timeout: "5s"

  metrics:
    enabled: true
    exporter: "prometheus"  # prometheus | otlp | null
    endpoint: "/metrics"
    labels:
      allowlist:
        - provider
        - model
        - adapter
        - tool
        - risk_level
        - status
        - direction
        - decision
        - error_type
      blocklist:
        - session_id
        - user_id
        - api_key

  logging:
    enabled: true
    level: "debug"  # debug | info | warn | error
    format: "json"  # json | text
    include_trace_id: true
    sampling:
      enabled: true
      max_entries_per_span: 100
    redactor:
      enabled: true
      patterns:
        - password
        - token
        - secret
        - api_key
        - authorization

  health:
    enabled: true
    endpoint: "/health"

# ========================================
# 可观察性配置说明
# ========================================
# 
# 启动后访问:
#   - Jaeger UI: http://localhost:16686
#   - Prometheus: http://localhost:9090
#   - Devrix Health: http://localhost:8080/health
#   - Devrix Metrics: http://localhost:9090/metrics
#
# OTLP 端口:
#   - gRPC: localhost:4317
#   - HTTP: localhost:4318
#
