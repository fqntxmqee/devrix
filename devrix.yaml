# Devrix 配置文件
# 文档: https://github.com/devrix/devrix/docs/config.md

# 应用配置
app:
  name: "devrix"
  version: "2.0.0"
  mode: "cli"  # cli | server | daemon

# 会话配置
session:
  idle_timeout: "30m"
  storage_dir: "~/.devrix/sessions"
  max_sessions: 1000

# 认证配置
auth:
  secret: "change-me-in-production"
  token_expiry: "24h"
  issuer: "devrix"

# 权限配置
permission:
  default_timeout: "60s"
  max_retries: 3

# 连接配置
connection:
  heartbeat_interval: "10s"
  heartbeat_timeout: "60s"

# 限流配置
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst_size: 10

# CLI 配置
cli:
  welcome_message: |
    ╔═══════════════════════════════════════════════════════════════╗
    ║                       Devrix v2.0                             ║
    ║        超级个体开发助手 (Super Individual Developer)             ║
    ╚═══════════════════════════════════════════════════════════════╝
  prompt: "> "
  ansi:
    user: "\x1b[34m"
    assistant: "\x1b[32m"
    error: "\x1b[31m"
    warning: "\x1b[33m"
    reset: "\x1b[0m"

# 命令配置
commands:
  prefix: "/"
  list:
    - "new"
    - "stop"
    - "help"

# 飞书配置
feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  bot_name: "Devrix"
  domain: ""  # 自定义域名，留空使用飞书默认
  encrypt_key: ""
  callback_path: "/feishu/webhook"
  port: "8080"
  use_webhook: false

# 实例配置（用于集群部署）
instance:
  id: ""  # 留空自动生成
  name: "devrix"
  address: ""
  port: 0
  cluster_enabled: false

# 日志配置
logging:
  level: "debug"  # debug | info | warn | error
  format: "json"  # json | text
  output: "stdout"  # stdout | stderr | file

# Metrics 配置
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# LLM 网关配置 (Layer 3)
llm_gateway:
  default_provider: "minimax"
  default_model: "MiniMax-M2.7-highspeed"
  default_tier: "default"
  model_tiers:
    fast: "MiniMax-M2.7-highspeed"
    default: "MiniMax-M2.7-highspeed"
    powerful: "deepseek-v4-latest"
  model_routing:
    "deepseek-*": deepseek
    "minimax-*": minimax
    "MiniMax-*": minimax
  circuit_breaker:
    failure_threshold: 5
    success_threshold: 2
    open_duration: "30s"
    scope: "provider"
  providers:
    deepseek:
      type: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "DEEPSEEK_API_KEY"
      default_model: "deepseek-v4-flash"
      fallback_model: "deepseek-v4-pro"
      timeout: "60s"
      max_tokens: 8192
      temperature: 0.7
      retry:
        max_attempts: 3
        initial_delay: "1s"
        max_delay: "10s"
        backoff: 2.0
    minimax:
      type: "minimax"
      base_url: "https://api.minimaxi.com/v1"
      api_key_env: "MINIMAX_API_KEY"
      default_model: "MiniMax-M2.7-highspeed"
      fallback_model: "MiniMax-M2.5-highspeed"
      timeout: "180s"
      max_tokens: 8192
      temperature: 0.7
      retry:
        max_attempts: 3
        initial_delay: "1s"
        max_delay: "10s"
        backoff: 2.0

# 上下文引擎配置 (Layer 2)
context_engine:
  max_context_tokens: 128000
  reserved_output_tokens: 8192
  tool_result_budget: 800
  compression_enabled: true
  compression_ratio: 0.6      # autocompact 触发阈值比率，默认 0.6（≈60K tokens）
  snip_ratio: 0.8             # snip 触发阈值比率（逐出旧消息），默认 0.8（≈80K tokens）

  # V2 新增: 压缩管道配置
  compression:
    max_messages: 50
    keep_tail_messages: 40
    microcompact:
      keep_recent_tool_results: 3
    autocompact:
      enabled: true
      model: "deepseek-v4-flash"       # 直接指定模型名，映射至 LLMRequest.Model
      summary_max_tokens: 512
      min_messages_for_summary: 8
      preserve_head_turns: 2
      preserve_tail_turns: 2
      timeout: "10s"                   # P99 摘要延迟上限

  main_transcript:
    enabled: true
    base_dir: "~/.devrix/sessions"

  # V2 新增: Token 计数源
  token_counter:
    source: "gateway"                  # gateway | heuristic（仅测试）

  snapshot:
    enabled: true
    backup_dir: "~/.devrix/context"
  system_prompt:
    sources:
      - ".devrix/AGENTS.md"
    fallback: "You are Devrix, a Super Individual Developer assistant."
    walk_up: true
    user_global: "~/.devrix/AGENTS.md"
    rules_glob: ".devrix/rules/*.md"
    max_chars: 40000
    enable_include: true


  # V3 新增: 跨 Session 长期记忆（SQLite）
  longterm:
    enabled: true
    db_path: "~/.devrix/memory.db"
    auto_store: false
    topics:
      - "architecture"
      - "decisions"
      - "bugs"
    recall_max_entries: 5
    recall_max_tokens: 2000

  # V5 新增: Harness Bootstrap（默认关闭，灰度开关）
  harness:
    enabled: false
    trusted: true
    prefetch:
      enabled: true
      max_walk_depth: 4
    tool_pool:
      simple_mode: false
      include_mcp: true
      deny_names: []
      deny_prefixes: []
    routing:
      enabled: false
      max_matches: 5
    deferred_init:
      enabled: true
    transcript:
      enabled: true
      compact_after_turns: 20
      session_log_enabled: true

  preflight:
    enabled: false
    mode: warn-only
    token_budget: 8000
    warn_ratio: 0.85
    tool_filter:
      enabled: true
      mode: auto-repair

  # V6 turn runtime (max_turns / compress_per_turn consumed by D7)
  turn_runtime:
    max_turns: 50
    compress_per_turn: true
    streaming_tools: true
  execution_flow:
    enabled: true
    link_tasks: true
    im_progress: true
  sandbox:
    enabled: true
    base_dir: "~/.devrix/sandboxes"
  user_context:
    mode: prepend
  attachments:
    enabled: true
    plan_mode_full_every: 5
  permission:
    default_mode: default
    plan:
      explore_agent_count: 3
      plan_agent_count: 1
      plan_file_dir: "~/.devrix/plans"
  tasks:
    mode: v2
    store_dir: "~/.devrix/tasks"
  subquery:
    fork_subagent_enabled: true
    sidechain_transcript: true
    default_subagent_max_turns: 50
  # DM-20260620-001-B (Phase B — AC6 + AC9) — sub-agent context inheritance
  # mode (brief / fork / full) + recursion depth cap. Default brief 节省 token;
  # legacy_mode=full 留作旧调用方显式切换 (后续 minor release 移除)。
  subagent:
    default_mode: brief
    legacy_mode: ""  # 留空走 default_mode
    max_depth: 3

  workspace:
    max_context_tokens: 8000
    agent_name: Devrix
    language: zh-CN
    embed_core_template: true
    prompt:
      use_sections: true
      enable_dynamic_boundary: true
      dynamic_sections:
        - git_status
        - env_info

# 工具执行安全 (Tool Security)
tool:
  sandbox:
    enabled: true
    allowlist_extra: []
    deny_patterns_extra: []
  concurrent_max: 10

# 可观察层配置 (Observability Layer)
observability:
  enabled: true

  tracing:
    enabled: true
    service_name: "devrix"
    service_version: "2.0.0"
    exporter: "otlp"  # console | otlp | null
    sampling:
      type: "always_on"  # always_on | always_off | trace_id_ratio
      rate: 1.0  # 0.0-1.0 (仅 trace_id_ratio 模式使用)
    otlp:
      endpoint: "http://localhost:4318/v1/traces"
      insecure: true
      timeout: "5s"

  metrics:
    enabled: true
    exporter: "prometheus"  # prometheus | otlp | null
    endpoint: "/metrics"
    labels:
      allowlist:
        - provider
        - model
        - adapter
        - tool
        - risk_level
        - status
        - direction
        - decision
        - error_type
      blocklist:
        - session_id
        - user_id
        - api_key

  logging:
    enabled: true
    level: "debug"  # debug | info | warn | error
    format: "json"  # json | text
    include_trace_id: true
    sampling:
      enabled: true
      max_entries_per_span: 100
    redactor:
      enabled: true
      patterns:
        - password
        - token
        - secret
        - api_key
        - authorization

  health:
    enabled: true
    endpoint: "/health"

  llm:
    log_content: true
    log_dir: "~/.devrix/logs/llm"

# ========================================
# 可观察性配置说明
# ========================================
# 
# 启动后访问:
#   - Jaeger UI: http://localhost:16686
#   - Prometheus: http://localhost:9090
#   - Devrix Health: http://localhost:8080/health
#   - Devrix Metrics: http://localhost:9090/metrics
#
# OTLP 端口:
#   - gRPC: localhost:4317
#   - HTTP: localhost:4318
#

# Multi-Agent Layer（Hub-Spoke Delegate v2）
multi_agent:
  enabled: true
  default_timeout: "15m"
  max_children: 3
  max_total_agents: 5
  delegate:
    enabled: true
    allow_async: true

# Agent Tool 配置
# 注册外部 CLI Agent 工具，由 LLM 按需调用。
agent_tools:
  enabled: true
  tools:
    - name: claude-code
      display_name: "Claude Code"
      description: "通用编码、代码审查、重构、调试 — 需要深度推理的编程任务首选"
      capabilities: ["coding", "code-review", "debug", "refactor", "planning", "testing"]
      role: |
        通用编码助手，精通代码审查、重构、调试与文档。

        何时使用:
        - 新功能开发：按计划实现代码，写测试
        - 代码审查：审查变更，发现潜在 bug 和设计问题
        - 调试：分析 bug 根因，提出修复方案
        - 重构：在保持行为不变的前提下改进代码结构
        - 设计文档：生成架构决策记录、API 文档

        何时不使用:
        - 纯文件搜索或代码浏览（应使用 Explore 代理）
        - 小范围编辑（应使用专用编辑工具）
        - 批处理或脚本化操作
      command: "claude"
      args: ["--print", "--verbose", "--output-format", "stream-json", "--input-format", "stream-json", "--replay-user-messages"]
      work_dir: "."
      timeout: "15m"
      idle_timeout: "10m"

    - name: cursor
      display_name: "Cursor Agent"
      description: "AI 代码编辑、文件操作、项目级重构 — 多文件编辑场景优选"
      capabilities: ["editing", "refactor", "project-wide", "code-generation"]
      role: |
        代码编辑专家，擅长多文件编辑和项目级重构。

        何时使用:
        - 多文件重构：跨文件修改变量命名、提取公共模块
        - 新模块生成：创建完整的新包或组件
        - 批量修改：对多个文件应用相同的模式变更
        - 代码格式化：统一代码风格

        何时不使用:
        - 需要深度分析的问题（应使用 claude-code）
        - 读操作或代码搜索
      type: "cursor"
      command: "cursor"
      model: "auto"
      mode: "force"
      work_dir: "."
      timeout: "15m"

# 运行时编排验证配置 (Orchestration Validator)
# 跨模型判官对 Agent 路由决策进行运行时验证，支持自动干预。
# 默认关闭（opt-in），开启后由独立 provider（如 minimax）验证主 LLM 的决策。
orchestration:
  enabled: true
  judge_provider: "minimax"
  judge_model: "MiniMax-M2.7-highspeed"
  fallback_judge_provider: "deepseek"
  fallback_judge_model: "deepseek-v4-flash"
  pre_filter_enabled: true
  min_interval_between_judges: "2s"
  max_judge_calls_per_minute: 10
  trusted_tool_allowlist: []
  intervention_threshold: 0.3
  auto_intervene: false

# D7 编排域配置
# 当 enabled: true 时，D1 将请求路由到 D7（默认 true；false 时启动失败）
d7:
  enabled: true                    # D1 入站必需 D7 orchestration entry
  fast_path_threshold: 90          # ClassifyIntent 置信度阈值
  command_first: true             # 命令优先（/plan /stop /task /help）
  plan_mode_approve_gate: true    # Wave 触发需要显式 Plan 批准
  # DM-20260706-006 hotfix: enable D7-S15 prior-output-summary injection
  # so turn N+1 sees turn N's finalText via <prior-output-summary>.
  # 0 (default) → no injection; same-session multi-turn LLM has no memory of prior turns.
  prior_context_rounds: 3         # inject last 3 turns' finalText into next turn's directive
  # DM-20260706-006 hotfix: LLM-driven semantic convergence (Plan A + B).
  # When the code-based verify rubber-stamps Pass but the artifact looks
  # structurally identical to a prior round (Jaccard ≥ min_similarity),
  # ask the LLM "did this round actually answer the user's question?".
  # The LLM's verdict overrides the code path. Defaults to OFF — the
  # hotfix path uses code-only verify until production validation.
  # NOTE: this flag currently has no runtime wiring; DefaultSemanticSimilarityConfig
  # returns Enabled=false. Production rollout requires adding the config
  # loader path in bootstrap (tracked in DM-20260706-006 follow-up).
  semantic_convergence:
    enabled: false
    min_similarity: 0.85            # Jaccard threshold to trigger LLM call
    lookback_n: 5                   # prior rounds scanned for mimicry
    timeout_ms: 8000                # LLM semantic call cap
    model_tier: ""                  # "" → use verifier default tier
