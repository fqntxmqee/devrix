# Devrix 配置文件
# 文档: https://github.com/devrix/devrix/docs/config.md

# 应用配置
app:
  name: "devrix"
  version: "2.0.0"
  mode: "cli"  # cli | server | daemon

# 会话配置
session:
  idle_timeout: "30m"
  storage_dir: "~/.devrix/sessions"
  max_sessions: 1000

# 认证配置
auth:
  secret: "change-me-in-production"
  token_expiry: "24h"
  issuer: "devrix"

# 权限配置
permission:
  default_timeout: "60s"
  max_retries: 3

# 连接配置
connection:
  heartbeat_interval: "10s"
  heartbeat_timeout: "60s"

# 限流配置
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst_size: 10

# CLI 配置
cli:
  welcome_message: |
    ╔═══════════════════════════════════════════════════════════════╗
    ║                    Devrix v2.0 - 开发大脑                    ║
    ║            多智能协同开发助手 (Multi-Agent CLI)               ║
    ╚═══════════════════════════════════════════════════════════════╝
  prompt: "> "
  ansi:
    user: "\x1b[34m"
    assistant: "\x1b[32m"
    error: "\x1b[31m"
    warning: "\x1b[33m"
    reset: "\x1b[0m"

# 命令配置
commands:
  prefix: "/"
  list:
    - "new"
    - "stop"
    - "help"

# 飞书配置
feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  bot_name: "Devrix"
  domain: ""  # 自定义域名，留空使用飞书默认
  encrypt_key: ""
  callback_path: "/feishu/webhook"
  port: "8080"
  use_webhook: false

# 实例配置（用于集群部署）
instance:
  id: ""  # 留空自动生成
  name: "devrix"
  address: ""
  port: 0
  cluster_enabled: false

# 日志配置
logging:
  level: "debug"  # debug | info | warn | error
  format: "json"  # json | text
  output: "stdout"  # stdout | stderr | file

# Metrics 配置
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# LLM 网关配置 (Layer 3)
llm_gateway:
  default_provider: "minimax"
  default_model: "MiniMax-M2.7-highspeed"
  model_routing:
    "deepseek-*": deepseek
    "minimax-*": minimax
    "MiniMax-*": minimax
  circuit_breaker:
    failure_threshold: 5
    success_threshold: 2
    open_duration: "30s"
    scope: "provider"
  providers:
    deepseek:
      type: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "DEEPSEEK_API_KEY"
      default_model: "deepseek-v4-flash"
      fallback_model: "deepseek-v4-pro"
      timeout: "60s"
      max_tokens: 8192
      temperature: 0.7
      retry:
        max_attempts: 3
        initial_delay: "1s"
        max_delay: "10s"
        backoff: 2.0
    minimax:
      type: "minimax"
      base_url: "https://api.minimaxi.com/v1"
      api_key_env: "MINIMAX_API_KEY"
      default_model: "MiniMax-M2.7-highspeed"
      fallback_model: "MiniMax-M2.5-highspeed"
      timeout: "180s"
      max_tokens: 8192
      temperature: 0.7
      retry:
        max_attempts: 3
        initial_delay: "1s"
        max_delay: "10s"
        backoff: 2.0

# 上下文引擎配置 (Layer 2)
context_engine:
  max_context_tokens: 128000
  reserved_output_tokens: 8192
  tool_result_budget: 800
  compression_enabled: true

  # V2 新增: 压缩管道配置
  compression:
    autocompact:
      enabled: true
      model: "deepseek-v4-flash"       # 直接指定模型名，映射至 LLMRequest.Model
      summary_max_tokens: 512
      min_messages_for_summary: 8
      preserve_head_turns: 2
      preserve_tail_turns: 2
      timeout: "10s"                   # P99 摘要延迟上限

  # V2 增强: PEV 配置
  pev:
    max_iterations: 3
    verify_mode: "basic"               # basic | none | commands
    verify_policy: "all_pass"          # all_pass | any_pass
    verify_commands:                   # 仅在 verify_mode=commands 时生效
      - name: "go-test"                # 仅允许 [a-z0-9_-]+
        executable: "go"
        args: ["test", "./..."]
        timeout: "120s"
      - name: "go-vet"
        executable: "go"
        args: ["vet", "./..."]
        timeout: "30s"

  # V2 新增: Token 计数源
  token_counter:
    source: "gateway"                  # gateway | heuristic（仅测试）

  snapshot:
    enabled: true
    backup_dir: "~/.devrix/context"
  system_prompt:
    sources:
      - "AGENTS.md"
      - ".devrix/AGENTS.md"
    fallback: "You are Devrix, a multi-agent development assistant."

  # V3 新增: Plan 阶段（默认关闭，等同 V2 Execute→Verify）
  plan:
    enabled: false
    auto_detect: true
    min_chars_for_plan: 200
    model: "deepseek-v4"
    max_milestones: 10
    timeout: "15s"
    on_milestone_fail: "fail_fast"

  # V3 新增: 跨 Session 长期记忆（SQLite）
  longterm:
    enabled: true
    db_path: "~/.devrix/memory.db"
    auto_store: false
    topics:
      - "architecture"
      - "decisions"
      - "bugs"
    recall_max_entries: 5
    recall_max_tokens: 2000

  # V5 新增: Harness Bootstrap（默认关闭，灰度开关）
  harness:
    enabled: false
    trusted: true
    prefetch:
      enabled: true
      max_walk_depth: 4
    tool_pool:
      simple_mode: false
      include_mcp: true
      deny_names: []
      deny_prefixes: []
    routing:
      enabled: false
      max_matches: 5
    deferred_init:
      enabled: true
    transcript:
      enabled: true
      compact_after_turns: 20
      session_log_enabled: true

  preflight:
    enabled: false
    mode: warn-only
    token_budget: 8000
    warn_ratio: 0.85
    tool_filter:
      enabled: true
      mode: auto-repair

  # V6 QueryLoop（Claude Code queryLoop 对齐）
  query_loop:
    enabled: true
    max_turns: 0
    compress_per_turn: true
    streaming_tools: true
  execution_flow:
    enabled: true
    link_tasks: true
    im_progress: true
  worktree:
    enabled: true
    base_dir: "~/.devrix/worktrees"
  user_context:
    mode: prepend
  attachments:
    enabled: true
    plan_mode_full_every: 5
  permission:
    default_mode: default
    plan:
      explore_agent_count: 3
      plan_agent_count: 1
      plan_file_dir: "~/.devrix/plans"
  tasks:
    mode: v2
    store_dir: "~/.devrix/tasks"
  subquery:
    fork_subagent_enabled: false
    sidechain_transcript: true
    default_subagent_max_turns: 50

  workspace:
    max_context_tokens: 8000
    agent_name: Devrix
    embed_core_template: true

# 工具执行安全 (Tool Security)
tool:
  sandbox:
    enabled: true
    allowlist_extra: []
    deny_patterns_extra: []
  concurrent_max: 10

# 可观察层配置 (Observability Layer)
observability:
  enabled: true

  tracing:
    enabled: true
    service_name: "devrix"
    service_version: "2.0.0"
    exporter: "otlp"  # console | otlp | null
    sampling:
      type: "always_on"  # always_on | always_off | trace_id_ratio
      rate: 1.0  # 0.0-1.0 (仅 trace_id_ratio 模式使用)
    otlp:
      endpoint: "http://localhost:4318/v1/traces"
      insecure: true
      timeout: "5s"

  metrics:
    enabled: true
    exporter: "prometheus"  # prometheus | otlp | null
    endpoint: "/metrics"
    labels:
      allowlist:
        - provider
        - model
        - adapter
        - tool
        - risk_level
        - status
        - direction
        - decision
        - error_type
      blocklist:
        - session_id
        - user_id
        - api_key

  logging:
    enabled: true
    level: "debug"  # debug | info | warn | error
    format: "json"  # json | text
    include_trace_id: true
    sampling:
      enabled: true
      max_entries_per_span: 100
    redactor:
      enabled: true
      patterns:
        - password
        - token
        - secret
        - api_key
        - authorization

  health:
    enabled: true
    endpoint: "/health"

  llm:
    log_content: true
    log_dir: "~/.devrix/logs/llm"

# ========================================
# 可观察性配置说明
# ========================================
# 
# 启动后访问:
#   - Jaeger UI: http://localhost:16686
#   - Prometheus: http://localhost:9090
#   - Devrix Health: http://localhost:8080/health
#   - Devrix Metrics: http://localhost:9090/metrics
#
# OTLP 端口:
#   - gRPC: localhost:4317
#   - HTTP: localhost:4318
#

# Multi-Agent Layer（Hub-Spoke Delegate v2）
multi_agent:
  enabled: true
  default_timeout: "15m"
  max_children: 3
  max_total_agents: 5
  delegate:
    enabled: true
    allow_async: true

# Agent Tool 配置
# 注册外部 CLI Agent 工具，由 LLM 按需调用。
agent_tools:
  enabled: true
  tools:
    - name: claude-code
      display_name: "Claude Code"
      description: "通用编码、代码审查、重构、调试"
      capabilities: ["coding", "code-review", "debug", "refactor"]
      role: |
        通用编码助手，精通代码审查、重构、调试与文档。
        适合需要深度推理的编程任务：重构模块、排查 Bug、代码评审、生成设计文档。
      command: "claude"
      args: ["--print", "--verbose", "--output-format", "stream-json", "--input-format", "stream-json", "--replay-user-messages"]
      work_dir: "."
      timeout: "15m"
      idle_timeout: "10m"

    - name: cursor
      display_name: "Cursor Agent"
      description: "AI 代码编辑、文件操作、项目级重构"
      capabilities: ["editing", "refactor", "project-wide"]
      role: |
        代码编辑专家，擅长多文件编辑和项目级重构。
        适合需要大量修改既有代码的任务：批量修改变量命名、跨文件重构、生成新模块代码。
      type: "cursor"
      command: "cursor"
      model: "auto"
      mode: "force"
      work_dir: "."
      timeout: "15m"

# 运行时编排验证配置 (Orchestration Validator)
# 跨模型判官对 Agent 路由决策进行运行时验证，支持自动干预。
# 默认关闭（opt-in），开启后由独立 provider（如 minimax）验证主 LLM 的决策。
orchestration:
  enabled: true
  judge_provider: "minimax"
  judge_model: "MiniMax-M2.7-highspeed"
  fallback_judge_provider: "deepseek"
  fallback_judge_model: "deepseek-v4-flash"
  pre_filter_enabled: true
  min_interval_between_judges: "2s"
  max_judge_calls_per_minute: 10
  trusted_tool_allowlist: []
  intervention_threshold: 0.3
  auto_intervene: false
